<!doctype html>
<!--
  Source of og.png, the 1200x630 social card. Not served.
  Regenerate after editing: render this file with Playwright at a 1200x630
  viewport (page.screenshot), or open it in a browser at exactly that size
  and screenshot it, then save the result as site/og.png. It shows
  screens/overview-light.png, a screenshot with invented example data.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Byname social card</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #fbfbfa; color: #1f1f1f; font-family: Geist, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  .left { position: absolute; left: 64px; top: 60px; bottom: 56px; width: 520px; display: flex; flex-direction: column; }
  .brand { display: inline-flex; align-items: center; gap: 12px; font: 600 28px/1 Geist, sans-serif; letter-spacing: -0.03em; }
  .mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: #1f1f1f; color: #fff; font: 600 20px/1 Geist, sans-serif; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; width: fit-content; margin-top: 56px; padding: 7px 14px; border: 1px solid #e1e1dd; border-radius: 999px; background: #fff; color: #62625f; font: 500 15px/1.3 "Geist Mono", monospace; letter-spacing: .04em; text-transform: uppercase; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #2a78d6; }
  h1 { margin-top: 26px; font: 600 60px/1.04 Geist, sans-serif; letter-spacing: -0.045em; }
  h1 span { color: #62625f; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 16px; color: #62625f; font: 400 20px/1 Geist, sans-serif; }
  .foot b { color: #1f1f1f; font-weight: 500; }
  .sep { width: 4px; height: 4px; border-radius: 50%; background: #b9b9b4; }
  .shot { position: absolute; left: 640px; top: 72px; width: 760px; height: 620px; border: 1px solid #e1e1dd; border-radius: 16px; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .04), 0 40px 90px -30px rgb(0 0 0 / .28); overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-bottom: 1px solid #e1e1dd; background: #f2f2f0; }
  .bar i { width: 10px; height: 10px; border-radius: 50%; background: #dcdcd8; display: block; }
  .shot img { display: block; width: 1100px; margin-left: -150px; }
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <span class="brand"><span class="mark">B</span>byname</span>
    <span class="eyebrow"><span class="dot"></span>Open source · self-hosted</span>
    <h1>Find out when AI assistants name you. <span>And who they name instead.</span></h1>
    <p class="foot"><b>MIT licensed</b><span class="sep"></span>One container<span class="sep"></span>Your Postgres</p>
  </div>
  <div class="shot"><div class="bar"><i></i><i></i><i></i></div><img src="screens/overview-light.png" alt="" /></div>
</div>
</body>
</html>
