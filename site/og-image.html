<!doctype html>
<!--
  Source of og.png, the 1200x630 social card. Not served.
  Regenerate after editing: render this file with Playwright at a 1200x630
  viewport (page.screenshot), or open it in a browser at exactly that size
  and screenshot it, then save the result as site/og.png. The grid is check
  #8 of the landing page's example data, an invented brand.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Byname social card</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..500&family=Inter:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #040406; color: #fff; -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; border: 1px solid #1f1f26;
    background-image: radial-gradient(circle, rgb(255 255 255 / .13) 1.2px, transparent 1.6px); background-size: 30px 30px; background-position: 15px 15px; }
  .left { position: absolute; left: 64px; top: 56px; bottom: 56px; width: 560px; display: flex; flex-direction: column; }
  .brand { display: inline-flex; align-items: center; gap: 12px; font: 600 30px/1 "Hanken Grotesk", sans-serif; letter-spacing: -0.03em; }
  .mark { display: grid; place-items: center; width: 34px; height: 34px; background: #fff; color: #040406; font: 600 19px/1 Inter, sans-serif; }
  .chip { display: inline-flex; align-items: center; gap: 12px; width: fit-content; margin-top: 52px; padding: 9px 14px; border: 1px solid #2c2c35; border-radius: 3px; background: #09090c; font: 500 15px/1 "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
  .chip::before { content: ""; width: 11px; height: 11px; background: #dff23a; box-shadow: 0 0 12px rgb(223 242 58 / .6); }
  h1 { margin-top: 26px; font: 330 58px/1.1 "Hanken Grotesk", sans-serif; letter-spacing: -0.012em; }
  .hl { background: #dff23a; color: #040406; padding: 0 .06em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .foot { margin-top: auto; color: #a8a8b3; font: 500 18px/1 Inter, sans-serif; }
  .foot b { color: #fff; font-weight: 500; }
  .mx { position: absolute; left: 700px; top: 56px; width: 436px; padding: 22px; border: 1px solid #2c2c35; background: #09090c; }
  .mx-k { color: #8a8a96; font: 500 12px/1 "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(6, 56px); gap: 8px; margin-top: 18px; }
  .grid i { display: grid; place-items: center; width: 56px; height: 52px; border: 1px solid #1f1f26; font: 500 13px/1 "JetBrains Mono", monospace; font-style: normal; color: #040406; }
  .grid i.n { background: #dff23a; border-color: #dff23a; }
  .grid i.c { border-color: #6f8cff; background: rgb(111 140 255 / .14); }
  .grid i.c::after { content: ""; width: 10px; height: 10px; background: #6f8cff; }
  .grid i.m::after { content: ""; width: 4px; height: 4px; background: #60606c; }
  .out { display: flex; align-items: baseline; gap: 14px; margin-top: 22px; padding-top: 18px; border-top: 1px solid #1f1f26; }
  .big { font: 300 64px/1 "Hanken Grotesk", sans-serif; letter-spacing: -0.03em; }
  .big small { color: #8a8a96; font-size: 24px; }
  .delta { margin-left: auto; padding: 7px 10px; border: 1px solid #dff23a; color: #dff23a; font: 500 13px/1 "JetBrains Mono", monospace; }
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <span class="brand"><span class="mark">B</span>byname</span>
    <span class="chip">Open source · self-hosted</span>
    <h1>Find out when AI assistants name you. And <span class="hl">who they name instead.</span></h1>
    <p class="foot"><b>MIT licensed.</b> One container and your Postgres.</p>
  </div>
  <div class="mx">
    <p class="mx-k">Check #8 · 6 questions · 36 answers</p>
    <div class="grid" id="grid"></div>
    <div class="out"><span class="big">29<small> of 36 named</small></span><span class="delta">+14 pts</span></div>
  </div>
</div>
<script>
  const cells = "222211|412112|43132-|111232|113523|-c-c--".replace(/\|/g, "");
  document.getElementById("grid").innerHTML = [...cells].map((ch) => /\d/.test(ch) ? `<i class="n">#${ch}</i>` : `<i class="${ch === "c" ? "c" : "m"}"></i>`).join("");
</script>
</body>
</html>
