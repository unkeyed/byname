        - name: network
          in: query
          schema:
            $ref: "#/components/schemas/SocialNetwork"
        - name: since
          in: query
          description: Only posts from then on, a day such as 2026-11-01 (midnight in the instance's time zone) or a time.
          schema:
            type: string
        - name: include_hidden
          in: query
          description: Also return mentions by left-out accounts or hidden by a filter, marked hidden.
          schema:
            type: boolean
        - name: limit
          in: query
          description: 1 to 500, default 100.
          schema:
            type: integer
            minimum: 1
            maximum: 500
