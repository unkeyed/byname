  /v1/compare:
    get:
      tags: [results]
      operationId: compareRuns
      summary: How each question and pair changed from one run to a later one.
      description: >-
        Put the older run in before. Across question set versions, questions
        follow the versions they carry on. A pair whose endpoint or fidelity
