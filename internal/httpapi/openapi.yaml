        Outcomes follow mentions, not citations.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      parameters:
        - name: before
          in: query
          required: true
          description: The earlier run's id.
          schema:
            type: integer
            minimum: 1
        - name: after
          in: query
          required: true
          description: The later run's id.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comparison"
        "400":
