openapi: 3.1.0
info:
  title: Byname
  version: 0.1.0
  summary: The REST API of a self-hosted tracker of how a brand shows up in AI answers and Google Search Console.
  description: |
    The React UI and your agents call the same routes. Agents send an API key
    (`Authorization: Bearer byn_...`, created under Settings > API keys).
    People send the `byname_session` cookie that a sign-in under `/auth` sets.

    Access. Each operation's `security` says who may call it:
    `security: []` is public; `session: []` alone needs a signed-in person;
    `session: [admin]` needs a signed-in admin; `apiKey: [<scope>]` with
    `session: [<scope>]` needs that scope, which an API key carries when it
    was created with it and a person carries through their role; `apiKey: []`
    takes any API key. A key or OAuth grant never has a scope its creator's
    role lacks: admin and editor have results:read, runs:write and
    config:write, viewer has results:read. Keys, apps and the team are for
    signed-in admins only, so a leaked agent key cannot mint more access.

    Every error is `{"error": "<message>"}` with a status that says what to do:
    400 fix the request, 401 bad or missing credentials, 403 this caller may
    not use this route (the message says which scope, role or sign-in it
    needs), 404 no such thing, 405 wrong method for this path (the `Allow`
    header lists the right ones), 409 it already exists, 429 wait for
    `Retry-After` seconds, 502 Treg did not answer a call Byname made for
    this request (the message says which), 503 the database or key store is
    down so retry later. Any other 5xx carries `request_id`, which the server
    log repeats.

    Lists are never null: an empty list is `[]`. Timestamps are RFC 3339.
    Unknown body fields are rejected with 400.

    `/mcp` (Streamable HTTP) does not take API keys: an MCP client signs in
    with OAuth 2.1 as a person, who approves it and its scopes in the
    browser. The OAuth endpoints are described by
    `/.well-known/oauth-authorization-server` and
    `/.well-known/oauth-protected-resource/mcp`, not here.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: The Byname instance serving this document.
tags:
  - name: system
    description: Health, status and this document.
  - name: config
    description: Your brand, competitors, questions, surfaces and schedule. results:read reads them and config:write changes them.
  - name: runs
    description: Run a check now, and pause or resume scheduled checks. Needs runs:write.
  - name: results
    description: >-
      What checks recorded. Runs, answers, compare, question history, rates,
      share of mentions, gaps and the jobs log. Plot everything by run, not by
      day. A series is one surface and model pair on one endpoint at one
      fidelity. Changing the endpoint or the fidelity starts a new series, and
      no number averages across series. A mention (the answer names you) and a
      citation (it links to one of your domains) are counted separately.
  - name: search
    description: >-
      Search engines: Google Search Console and Bing Webmaster Tools, each a
      provider named in the path. results:read reads the synced clicks,
      impressions and position, goals and each provider's status;
      config:write changes goals and branded search terms; a signed-in admin
      connects a provider, picks its site and disconnects. Days are each
      provider's own (Google's Pacific Time, Bing's UTC), and windows end on
      the provider's latest final day. Bing reports searches and pages a week
      at a time, so its windows are whole weeks. No response adds two
      engines together.
  - name: changes
    description: >-
      Site changes. Merged pull requests from a connected GitHub repo, or
      changes logged by hand, with Google's first crawl after each and the
      interim and final difference-in-differences reads against control
      pages. results:read reads them; config:write logs changes and edits
      control pages, path rules and the read settings; a signed-in admin
      connects the repo.
  - name: social
    description: >-
      Social mentions. Posts that name you on X, Reddit, Hacker News,
      LinkedIn, YouTube, Threads and Bluesky, found through Treg (Bluesky
      through its own public API), with the accounts you left out hidden at
      read time, and the topics and subreddits you filter by. results:read
      reads mentions, digests, settings, the left-out list and the filters;
      config:write changes them.
  - name: other-brands
    description: >-
      The brands AI answers name that you don't track, found by a small model
      reading each new answer through Treg, and every brand's logo from
      Context.dev through Treg. None of it counts in any score. results:read
      reads them; config:write tracks, hides and unhides a brand and changes
      the settings; runs:write starts reading past answers.
  - name: settings
    description: Keys, apps, the team and the Treg token, for signed-in admins, and the consent page.
  - name: auth
    description: Sign-in for people. Agents use API keys instead.
  - name: account
    description: How the signed-in person signs in. Session only.
paths:
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: Liveness check. 200 when the process is up; does not touch the database.
      security: []
      responses:
        "200":
          description: The process is up.
  /v1/openapi.yaml:
    get:
      tags: [system]
      operationId: getOpenAPI
      summary: This document.
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 description of every route.
          content:
            application/yaml:
              schema:
                type: string
  /v1/status:
    get:
      tags: [system]
      operationId: getStatus
      summary: This instance's version and whether onboarding is done. The MCP status tool returns the same.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/settings:
    get:
      tags: [config]
      operationId: getSettings
      summary: Your brand, market, schedule, spend caps and call limits, with whether checks are paused and when the next one is due.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [config]
      operationId: putSettings
      summary: Replace the settings and your own brand.
      description: >-
        Send every field as GET returns them, leaving out the schedule's state.
        spend_cap_month_usd and raw_retention_days take null for none. A
        schedule change moves the next check to the next scheduled time and
        never makes a check due at once.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Settings"
              unevaluatedProperties: false
      responses:
        "200":
          description: The settings as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/brands:
    get:
      tags: [config]
      operationId: listBrands
      summary: Every brand Byname looks for in answers, your own first, then competitors and technologies by name.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: Brands.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [config]
      operationId: upsertBrand
      summary: Add a competitor or technology, or replace the one with the same name ignoring case.
      description: Your own brand is set with PUT /v1/settings. Naming it here is 409.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "200":
          description: The brand as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/brands/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    put:
      tags: [config]
      operationId: updateBrand
      summary: Replace a competitor or technology by id, which can rename it.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "200":
          description: The brand as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [config]
      operationId: deleteBrand
      summary: Delete a competitor or technology and its recorded mentions.
      description: Your own brand cannot be deleted. Its id is 404 here.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/questions:
    get:
      tags: [config]
      operationId: getQuestions
      summary: The current question set, with how it carries on the version before it.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: The current question set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No question set exists yet. Create the first with PUT /v1/questions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [config]
      operationId: putQuestions
      summary: Replace the questions, creating a new version on any change.
      description: >-
        Send the whole set. Sending the current set again changes nothing and
        returns it. Any other change creates the next version. A question whose
        text matches a current question, ignoring case and punctuation, carries
        that question on by itself. Every other current question, changed or
        removed, must be named in some question's replaces or in retired, or
        the request is 400 and names them. History follows each question
        through every version it carries on.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionsInput"
      responses:
        "200":
          description: The current question set, new or unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/question-sets:
    get:
      tags: [config]
      operationId: listQuestionSets
      summary: Every version of the questions, newest first.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: Question set versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionSetSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/question-sets/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [config]
      operationId: getQuestionSet
      summary: One version of the questions, with how it carries on the version before it.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: The question set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/surfaces:
    get:
      tags: [config]
      operationId: listSurfaces
      summary: Every surface Byname can ask, configured or not, with its model pairs.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: Surfaces in registry order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Surface"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/surfaces/{key}:
    parameters:
      - $ref: "#/components/parameters/surfaceKey"
    put:
      tags: [config]
      operationId: putSurface
      summary: Turn a surface on or off, move it to another route, and, when models is present, set which of its models are enabled.
      description: >-
        Listed models are enabled and the surface's other models disabled.
        Listing a paused model unpauses it. Each model must be on the
        route's live model list, so the route's key must be set first.
        App surfaces read by Treg or a scraping provider's key take no
        models; on a provider or gateway route they need at least one.
        Moving to another route needs its key set by an admin, resets every
        pair's test, and gives each pair the new route's label. Turning a
        surface on needs at least one enabled model.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurfaceInput"
      responses:
        "200":
          description: The surface as saved, with every model pair it has had.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Surface"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/surfaces/{key}/models:
    parameters:
      - $ref: "#/components/parameters/surfaceKey"
    get:
      tags: [config]
      operationId: listSurfaceModels
      summary: The models a route offers the surface now, read live at no cost.
      description: 400 where the surface takes no model on the route (an app read by Treg or a scraping key), and when the route's key is not set.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      parameters:
        - name: route
          in: query
          description: The route whose list to read. Omit for the surface's current route.
          schema:
            $ref: "#/components/schemas/Route"
        - name: base_url
          in: query
          description: A gateway's base URL, for the gateway route.
          schema:
            type: string
      responses:
        "200":
          description: The live model list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/onboarding:
    get:
      tags: [config]
      operationId: getOnboarding
      summary: How far onboarding has come, and what still blocks finishing it.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: The onboarding state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/onboarding/steps/{step}:
    parameters:
      - name: step
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/StepKey"
    put:
      tags: [config]
      operationId: saveOnboardingStep
      summary: Mark an onboarding step saved.
      description: Call it after saving the step's data with its own route, or to skip an optional step. Marking a step twice changes nothing. review is finished with POST /v1/onboarding/finish.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      responses:
        "200":
          description: The onboarding state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/onboarding/finish:
    post:
      tags: [config]
      operationId: finishOnboarding
      summary: Finish onboarding and set the first scheduled check.
      description: >-
        Needs every required step saved, the instance ready to check, and a
        passing test for every enabled pair; 400 lists what is missing.
        Until it succeeds nothing runs on schedule and Run now refuses.
        With no monthly spend cap set, it sets one of three times the
        monthly estimate of checks and social searches (GET /v1/costs),
        rounded up to a whole dollar and at least $5.00. Finishing again
        changes nothing. Queue the first check with POST /v1/runs.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      responses:
        "200":
          description: The finished onboarding state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/pairs/{id}/test:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [config]
      operationId: testPair
      summary: Make one short call for a surface and model pair through its route, and set its fidelity from what it showed.
      description: >-
        Asks the current set's first question. The call is paid. A failed
        call is a result with status failed, not an error, and leaves the
        pair's fidelity as it was. A developer tool stays model_match only
        when the route accepts the model, search was on and the answer
        searched.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      responses:
        "200":
          description: What the test call showed, and the pair after it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairTest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/estimate:
    get:
      tags: [config]
      operationId: getEstimate
      summary: The estimated cost of one check.
      description: >-
        Calls are questions times enabled pairs. Each pair's cost per call is
        the mean reported cost of its endpoint's past answers, or else the
        endpoint's sampled cost. Pairs with neither are counted as unknown,
        never guessed. Token-billed answers vary, so this is an estimate.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: The estimate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/questions/{id}/scoring:
    parameters:
      - $ref: "#/components/parameters/id"
    put:
      tags: [config]
      operationId: setQuestionScoring
      summary: Count a question's answers in scores, leave them out, or go back to the default.
      description: >-
        A question whose text names your brand is still asked and its answers
        shown, but by default they count in no score, because an answer
        naming you is no news when the question did. Every other question
        counts by default. The choice covers the earlier versions the
        question carries on, and later versions carry it on. Only a question
        of the current set takes it.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionScoringInput"
      responses:
        "200":
          description: The question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/costs:
    get:
      tags: [config]
      operationId: getCosts
      summary: What Byname costs, expected and spent, in US dollars.
      description: >-
        The estimated cost of one answer on each surface on its current
        route, of one check (the same estimate as GET /v1/estimate), of a
        month of checks at the schedule, and of a month of social searches
        at their settings, split into the Treg networks and Bluesky, which
        is free. Then what the calendar month has spent in the instance's
        time zone, which the monthly spend cap counts. Expected figures are
        estimates. Treg bills you, not Byname.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: The cost facts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Costs"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/naming-check:
    post:
      tags: [config]
      operationId: checkNaming
      summary: Check text while someone types it, before anything is saved.
      description: >-
        For each question text, the brands it names by the rules answers are
        scored with, and whether it names your brand, which leaves its
        answers out of scores by default. For each alias, whether it is a
        common English word that everyday text would match. Stores nothing.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamingCheckInput"
      responses:
        "200":
          description: What each text names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamingCheck"
        "400":
