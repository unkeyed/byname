          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/password:
    post:
      tags: [auth]
      operationId: passwordLogin
      summary: 'Check an email and password. Never a session on its own: success sets byname_pending and asks for a second factor.'
      description: Only with PASSWORD_LOGIN on (404 otherwise). After five wrong passwords for one email, or thirty from one IP, attempts wait with exponential backoff (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Signed in (Set-Cookie carries the session), or a second factor is due (Set-Cookie carries byname_pending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/second-factor:
    get:
      tags: [auth]
      operationId: getSecondFactor
      summary: The second factors the pending login (byname_pending cookie) accepts.
      security: []
      responses:
        "200":
          description: The pending login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/second-factor/code:
    post:
      tags: [auth]
      operationId: secondFactorCode
      summary: Complete the pending login with an authenticator code or a recovery code. A wrong code leaves it pending.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Signed in (Set-Cookie carries the session), or a second factor is due (Set-Cookie carries byname_pending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/second-factor/passkey/begin:
    post:
      tags: [auth]
      operationId: beginSecondFactorPasskey
      summary: Start completing the pending login with a passkey.
      security: []
      responses:
        "200":
          description: The handle and the options for navigator.credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeremonyStart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/second-factor/passkey/finish:
    post:
      tags: [auth]
      operationId: finishSecondFactorPasskey
      summary: Complete the pending login with a passkey.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeremonyFinish"
      responses:
        "200":
          description: Signed in (Set-Cookie carries the session), or a second factor is due (Set-Cookie carries byname_pending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/oauth/{provider}/start:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google, github, oidc]
      - name: intent
        in: query
        description: login (default), link or reauth (signed in), setup or invite (with token).
        schema:
          type: string
          enum: [login, link, reauth, setup, invite]
      - name: token
        in: query
        description: The setup or invite token.
        schema:
          type: string
      - name: next
        in: query
        description: Where to land after signing in. Same-origin paths only.
        schema:
          type: string
    get:
      tags: [auth]
      operationId: startOAuth
      summary: Redirect to the provider. Sets byname_oauth, which binds the flow to this browser.
      security: []
      responses:
        "303":
          description: To the provider, or back to the page with ?error= when the flow cannot start.
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/oauth/{provider}/callback:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google, github, oidc]
    get:
      tags: [auth]
      operationId: oauthCallback
      summary: The redirect URI to register at the provider. Completes the flow and redirects into the app.
      description: Social sign-in never creates an account for a stranger. It signs in a user whose email matches the provider-verified email, accepts a live invite for it, or joins an ALLOWED_EMAIL_DOMAINS address; anything else is refused.
      security: []
      responses:
        "303":
          description: Into the app, to /login?second_factor=1 when a code is due, or back with ?error=.
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/gsc/callback:
    get:
      tags: [search]
      operationId: finishGoogleOAuth
      summary: Where Google sends the browser back after Search Console consent.
      description: Only the admin who started the sign-in can finish it, with their session. Always redirects to /settings/search-engines, or /onboarding/search when the sign-in started there, with ?connected=google, or ?error= saying what went wrong, including a missing or non-admin session.
      security: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Back to Settings > Search engines, or onboarding.
  /auth/setup/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [auth]
      operationId: checkSetup
      summary: Whether a setup or recovery link still works. Setup links exist only while nobody can sign in; recovery links come from `byname recover` and last an hour.
      security: []
      responses:
        "200":
          description: It works.
          content:
            application/json:
              schema:
                type: object
                required: [recovery]
                properties:
                  recovery:
                    type: boolean
                    description: True for a recovery link, which adds a passkey to the existing account with the email it was issued for.
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/invites/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [auth]
      operationId: getInvite
      summary: Whether an invite is live, and if so who it is for and the role they join with.
      security: []
      responses:
        "200":
          description: The invite. An unknown, used or expired one answers live false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/signup/passkey/begin:
    post:
      tags: [auth]
      operationId: beginPasskeySignup
      summary: Start registering the first passkey of a new account, through a setup link (email and name) or an invite (name).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                setup_token:
                  type: string
                invite_token:
                  type: string
                email:
                  type: string
                name:
                  type: string
      responses:
        "200":
          description: The handle and the options for navigator.credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeremonyStart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/signup/passkey/finish:
    post:
      tags: [auth]
      operationId: finishPasskeySignup
      summary: Create the account with its passkey and sign in. Uses up the setup link or invite.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeremonyFinish"
      responses:
        "200":
          description: Signed in (Set-Cookie carries the session), or a second factor is due (Set-Cookie carries byname_pending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session and clear the cookie. Succeeds without a session too.
      security: []
      responses:
        "204":
          description: Logged out.
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: An API key from Settings > API keys, such as `byn_ab12...`.
    session:
      type: apiKey
      in: cookie
      name: byname_session
      description: Set by a completed sign-in under /auth. Unsafe cross-site browser requests are rejected.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    surfaceKey:
      name: key
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SurfaceKey"
    credentialKind:
      name: kind
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CredentialKind"
    limit:
      name: limit
      in: query
      description: How many to return, 1 to 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    since:
      name: since
      in: query
      description: Only runs started at or after this time, as a date such as 2026-11-01 (midnight UTC) or an RFC 3339 time. Omit for all time.
      schema:
        type: string
    surface:
      name: surface
      in: query
      description: Only this surface. Omit for every surface.
      schema:
        $ref: "#/components/schemas/SurfaceKey"
    model:
      name: model
      in: query
      description: Only pairs on this model, such as claude-sonnet-4-5. Omit for every model.
      schema:
        type: string
    by:
      name: by
      in: query
      description: What one line is. pair is one per surface and model pair; surface is one per surface, combining its models only where they share an endpoint and fidelity, with pair id 0 and an empty model.
      schema:
        type: string
        enum: [pair, surface]
        default: pair
    searchProvider:
      name: provider
      in: path
      required: true
      description: The search engine, one of those GET /v1/search/providers lists, such as google or bing.
      schema:
        type: string
    searchFrom:
      name: from
      in: query
      description: The first day, such as 2026-08-01. Defaults to 90 days before to.
      schema:
        type: string
        format: date
    searchTo:
      name: to
      in: query
      description: The last day. Defaults to the latest day stored for daily, and the latest final day for brand.
      schema:
        type: string
        format: date
    searchDays:
      name: days
      in: query
      description: The window in days, ending on the latest final day. Rounded to a whole number of the provider's step_days, so whole weeks for Bing.
      schema:
        type: integer
        minimum: 1
        maximum: 480
        default: 28
    searchLimit:
      name: limit
      in: query
      description: How many rows, 1 to 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
  responses:
    BadRequest:
      description: The request is malformed. The message says which field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No credentials, or a bad API key, session or password.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: This caller may not use this route. The message says what it needs; a scope, a signed-in person, or an admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such key, app, user, invite, sign-in request, brand, question, question set, surface, run or answer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: That email already has an account, the change would leave no admin, or another brand already has that name.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Reauth:
      description: >-
        This change (how you sign in, API keys, connected apps, the team or the Treg token)
        needs a sign-in within the last 15 minutes (code reauth_required).
        Confirm with POST /v1/account/reauth/*, or the reauth OAuth intent, and
        retry. Also 403 for a caller the route is not for, as Forbidden.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
              code:
                type: string
                enum: [reauth_required]
    TooManyRequests:
      description: Too many failed attempts for this email, account or IP. Wait Retry-After seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The database or the key store (Postgres or Unkey) could not answer. Retry shortly.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: Treg did not answer a call Byname made for this request. The message says which call. Retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    EventKindName:
      type: string
      enum: [check_completed, check_refused, check_failed, spend_cap_reached, pair_paused, goal_reached, search_moved, change_verdict, token_expiring, social_digest, page_linked]
    EventKind:
      type: object
      description: One kind of event a channel can subscribe to.
      required: [kind, title, description, audience]
      properties:
        kind:
          $ref: "#/components/schemas/EventKindName"
        title:
          type: string
        description:
          type: string
        audience:
          type: string
          enum: ["results:read", admin]
          description: results:read when anyone who reads results sees it in the app, admin when only admins do.
    CheckCompletedPayload:
      type: object
      description: check_completed. A finished check against the previous one with answers.
      required: [run_id, previous_run_id, gained, lost, moved, unchanged, not_comparable, net, named, answered, band, move, spend_usd, top]
      properties:
        run_id:
          type: integer
        previous_run_id:
          type: integer
          description: 0 for the first check with answers.
        gained:
          type: integer
          description: Questions on one AI app and model that most answers did not name you on in the previous check and do now. These count the cells GET /v1/compare compares, not answers.
        lost:
          type: integer
          description: Questions on one AI app and model that most answers named you on in the previous check and do not now.
        moved:
          type: integer
          description: Questions on one AI app and model that most answers named you on both times, at a different best position.
        unchanged:
          type: integer
        not_comparable:
          type: integer
        net:
          type: integer
        named:
          type: integer
          description: Answers that named you, of answered.
        answered:
          type: integer
          description: Answers that did not fail and count in scores.
        band:
          oneOf:
            - $ref: "#/components/schemas/Band"
            - type: "null"
          description: The 95% band on named of answered. Null when none answered, and on alerts from before Byname added it.
        move:
          oneOf:
            - $ref: "#/components/schemas/Move"
            - type: "null"
          description: Whether the share of answers naming you moved since the previous check by more than chance gives, as GET /v1/compare returns it. Null on the first check, and on alerts from before Byname added it.
        spend_usd:
          type: number
        top:
          type: array
          description: The questions that changed most, at most three.
          items:
            type: object
            required: [question_id, question, gained, lost, moved]
            properties:
              question_id:
                type: integer
              question:
                type: string
              gained:
                type: integer
              lost:
                type: integer
              moved:
                type: integer
    CheckRefusedPayload:
      type: object
      description: check_refused. Treg refused a request and the check stopped.
      required: [run_id, code, message]
      properties:
        run_id:
          type: integer
        code:
          type: string
          description: Treg's error code, such as insufficient_balance.
        message:
          type: string
    CheckFailedPayload:
      type: object
      description: check_failed.
      required: [run_id, message]
      properties:
        run_id:
          type: integer
        message:
          type: string
    SpendCapReachedPayload:
      type: object
      description: spend_cap_reached.
      required: [run_id, spend_usd, message]
      properties:
        run_id:
          type: integer
        spend_usd:
          type: number
        message:
          type: string
    PairPausedPayload:
      type: object
      description: pair_paused. An AI app stopped offering a model you picked.
      required: [pair_id, surface, model, reason]
      properties:
        pair_id:
          type: integer
        surface:
          type: string
        model:
          type: string
        reason:
          type: string
    GoalReachedPayload:
      type: object
      description: goal_reached.
      required: [goal_id, metric, window_days, target, value, due_on]
      properties:
        goal_id:
          type: integer
        metric:
          type: string
          enum: [clicks, impressions, non_brand_clicks]
        window_days:
          type: integer
        target:
          type: number
        value:
          type: number
        due_on:
          type: string
          format: date
    SearchMovedPayload:
      type: object
      description: search_moved. A 28-day Search Console metric against the 28 days before.
      required: [metric, window_days, before, after]
      properties:
        metric:
          type: string
          enum: [clicks, impressions, non_brand_clicks]
        window_days:
          type: integer
        before:
          type: number
        after:
          type: number
    ChangeVerdictPayload:
      type: object
      description: change_verdict. A site change's final result against the comparison pages.
      required: [change_id, url, verdict, detail]
      properties:
        change_id:
          type: integer
        url:
          type: string
        verdict:
          type: string
          enum: [improved, worsened, no_change, insufficient_data]
        detail:
          type: string
          description: The result in one line.
    TokenExpiringPayload:
      type: object
      description: token_expiring. The GitHub token for site changes nears its expiry.
      required: [provider, repo, expires_at]
      properties:
        provider:
          type: string
        repo:
          type: string
        expires_at:
          type: string
          format: date-time
    SocialDigestPayload:
      type: object
      description: social_digest. One finished period's posts that name you, without the accounts left out when it was sent.
      required: [cadence, from, to, mentions, hidden, networks, new_authors, new_authors_count, spend_usd, spend_missing_calls]
      properties:
        cadence:
          type: string
          enum: [daily, weekly]
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        mentions:
          type: integer
        hidden:
          type: integer
          description: Posts by left-out accounts or hidden by a filter, not counted in mentions.
        networks:
          type: array
          items:
            type: object
            required: [network, title, mentions, top]
            properties:
              network:
                type: string
              title:
                type: string
              mentions:
                type: integer
              top:
                type: array
                description: The most engaged posts, at most three.
                items:
                  type: object
                  required: [author, text, url, engagement]
                  properties:
                    author:
                      type: string
                    text:
                      type: string
                      description: The start of the post.
                    url:
                      type: string
                    engagement:
                      type: integer
        new_authors:
          type: array
          description: At most ten of the accounts whose first mention fell in the period.
          items:
            type: string
        new_authors_count:
          type: integer
        spend_usd:
          type: number
        spend_missing_calls:
          type: integer
    PageLinkedPayload:
      type: object
      description: page_linked. A check's answers linked for the first time to a page marked as answering a question.
      required: [page_id, url, question_text, apps, answers]
      properties:
        page_id:
          type: integer
        url:
          type: string
        question_text:
          type: string
          description: The question the page was marked as answering.
        apps:
          type: array
          items:
            type: string
          description: The AI apps whose answers linked to it, by name.
        answers:
          type: integer
          description: That check's answers that linked to it, to any question.
    Alert:
      type: object
      description: One notification, an event as the app shows it. lines are the text email and Slack send.
      required: [id, kind, title, lines, path, payload, created_at, read]
      properties:
        id:
          type: integer
        kind:
          $ref: "#/components/schemas/EventKindName"
        title:
          type: string
        lines:
          type: array
          items:
            type: string
        path:
          type: string
          description: The page it links to, relative to the app's address, such as /ai/what-changed?before=11&after=12.
        payload:
          description: The event's data, whose shape depends on kind. check_completed carries the same counts GET /v1/compare returns.
          oneOf:
            - $ref: "#/components/schemas/CheckCompletedPayload"
            - $ref: "#/components/schemas/CheckRefusedPayload"
            - $ref: "#/components/schemas/CheckFailedPayload"
            - $ref: "#/components/schemas/SpendCapReachedPayload"
            - $ref: "#/components/schemas/PairPausedPayload"
            - $ref: "#/components/schemas/GoalReachedPayload"
            - $ref: "#/components/schemas/SearchMovedPayload"
            - $ref: "#/components/schemas/ChangeVerdictPayload"
            - $ref: "#/components/schemas/TokenExpiringPayload"
            - $ref: "#/components/schemas/SocialDigestPayload"
            - $ref: "#/components/schemas/PageLinkedPayload"
        created_at:
          type: string
          format: date-time
        read:
          type: boolean
          description: Whether the caller's person has read it.
    AlertList:
      type: object
      required: [alerts, unread]
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        unread:
          type: integer
          description: Unread notifications the caller may see, in all.
    ChannelKind:
      type: string
      enum: [smtp, email_api, slack_webhook, webhook]
      description: email_api is Resend's HTTP API, the one email API Byname speaks.
    NotificationChannel:
      type: object
      description: A notification channel. No response ever carries its secrets.
      required: [id, name, kind, settings, events, enabled, last_test_at, last_test_status, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          $ref: "#/components/schemas/ChannelKind"
        settings:
          type: object
          description: "What the channel shows in the clear. smtp: host, port, tls (starttls, tls or none), username, from, to. email_api: from, to. slack_webhook: nothing. webhook: url."
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventKindName"
        enabled:
          type: boolean
        last_test_at:
          type: [string, "null"]
          format: date-time
        last_test_status:
          type: string
          description: ok, or why the last test failed. Empty until tested.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChannelInput:
      type: object
      required: [name, kind, settings, events]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          $ref: "#/components/schemas/ChannelKind"
        settings:
          type: object
          description: See NotificationChannel.settings.
        secrets:
          type: object
          description: "smtp: password. email_api: api_key. slack_webhook: webhook_url. webhook: none, Byname makes its signing secret. On an edit, only the secrets to change."
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventKindName"
        enabled:
          type: boolean
          description: Defaults to true on create, and to the current state on an edit.
    Delivery:
      type: object
      description: One notification's delivery to one channel.
      required: [id, alert_id, kind, title, channel_id, channel_name, channel_kind, status, attempts, error, sent_at, next_attempt_at, created_at]
      properties:
        id:
          type: integer
        alert_id:
          type: integer
        kind:
          $ref: "#/components/schemas/EventKindName"
        title:
          type: string
        channel_id:
          type: integer
        channel_name:
          type: string
        channel_kind:
          $ref: "#/components/schemas/ChannelKind"
        status:
          type: string
          enum: [pending, sent, failed]
          description: failed after 5 attempts with backoff.
        attempts:
          type: integer
        error:
          type: string
          description: Why the last attempt failed.
        sent_at:
          type: [string, "null"]
          format: date-time
        next_attempt_at:
          type: [string, "null"]
          format: date-time
          description: When a pending delivery is tried again.
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        request_id:
          type: string
          description: Present on 5xx; the server log carries the same id.
    Scope:
      type: string
      enum: [results:read, runs:write, config:write]
      description: results:read reads runs, answers and settings, never secrets. runs:write queues, pauses and resumes checks. config:write edits the brand, competitors, questions, surfaces and schedule.
    Role:
      type: string
      enum: [admin, editor, viewer]
      description: admin and editor have every scope, viewer has results:read. Only admins manage keys, apps and the team.
    Actor:
      type: object
      description: Who is calling, with the scopes they may use now.
      required: [via, id, user_id, name, role, scopes]
      properties:
        via:
          type: string
          enum: [session, api_key, oauth]
        id:
          type: string
          description: The session's user, the key, or the OAuth connection.
        user_id:
          type: integer
          description: The person behind the call.
        name:
          type: string
          description: An app's name reads "Claude Code (via Alex Rivera)".
        role:
          $ref: "#/components/schemas/Role"
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
    Status:
      type: object
      required: [version, onboarded]
      properties:
        version:
          type: string
        onboarded:
          type: boolean
          description: Whether someone has finished setting up the brand, surfaces and questions.
    Invitation:
      type: object
      required: [live]
      properties:
        live:
          type: boolean
          description: False for an unknown, used or expired invite, which then has no email or role.
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    Key:
      type: object
      required: [id, name, prefix, scopes, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: The first characters of the key, such as byn_ab12, to tell keys apart.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
          description: What the key was granted. A request gets only the part its creator's role still has.
        expires_at:
          type: string
          format: date-time
          description: When the key stops working. Absent for a key that works until revoked. Expired keys stay listed until revoked.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    App:
      type: object
      description: An MCP client a person approved. Anyone can register an app under any name, so the name is the app's own claim.
      required: [id, name, approved_by, scopes, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        approved_by:
          type: string
          description: The name, or else the email, of the person it acts as.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
          description: What the person approved. The app gets only the part their role still has.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    ConsentRequest:
      type: object
      required: [client_name, redirect_uri, client_registered_at, scopes]
      properties:
        client_name:
          type: string
          description: The name the app registered itself with. Unverified.
        redirect_uri:
          type: string
          description: Where the code goes if the person approves.
        client_registered_at:
          type: string
          format: date-time
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
          description: The scopes the person may choose from, what the app asked for, or every scope when it named none.
    CreatedKey:
      allOf:
        - $ref: "#/components/schemas/Key"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The plaintext key. Shown only in this response.
    SignInResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [signed_in, second_factor]
        second_factors:
          type: array
          description: With second_factor, what the pending login accepts.
          items:
            type: string
            enum: [totp, recovery_code, passkey]
    CeremonyStart:
      type: object
      required: [handle, options]
      properties:
        handle:
          type: string
          description: Send back with the credential.
        options:
          type: object
          description: "{publicKey: ...} for navigator.credentials.get or .create, with binary fields as base64url."
    CeremonyFinish:
      type: object
      required: [handle, credential]
      additionalProperties: false
      properties:
        handle:
          type: string
        credential:
          type: object
          description: The PublicKeyCredential as JSON, binary fields base64url.
        name:
          type: string
          description: A name for a new passkey.
    AuthOptions:
      type: object
      required: [providers, password_login, setup_required]
      properties:
        providers:
          type: array
          items:
            type: object
            required: [id, name, callback_url]
            properties:
              id:
                type: string
                enum: [google, github, oidc]
              name:
                type: string
              callback_url:
                type: string
                description: The redirect URI to register at the provider.
        password_login:
          type: boolean
        setup_required:
          type: boolean
          description: True while nobody can sign in. The server logs a setup link at start.
    Passkey:
      type: object
      required: [id, name, created_at, last_used_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
    LinkedIdentity:
      type: object
      required: [provider, email, created_at, last_used_at]
      properties:
        provider:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
    Session:
      type: object
      required: [id, method, user_agent, created_at, last_seen_at, current]
      properties:
        id:
          type: integer
        method:
          type: string
          description: The factors that opened it, joined with +, e.g. password+totp or github.
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        current:
          type: boolean
    Account:
      type: object
      required: [user, passkeys, identities, totp, recovery_codes_left, password, recent, sessions]
      properties:
        user:
          $ref: "#/components/schemas/User"
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
        identities:
          type: array
          items:
            $ref: "#/components/schemas/LinkedIdentity"
        totp:
          type: boolean
        recovery_codes_left:
          type: integer
        password:
          type: boolean
        recent:
          type: boolean
          description: Whether this session signed in within 15 minutes and may change sign-in methods.
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    TOTPEnrolment:
      type: object
      required: [handle, secret, uri, qr]
      properties:
        handle:
          type: string
        secret:
          type: string
          description: Base32, for typing into an app by hand.
        uri:
          type: string
          description: The otpauth:// URI.
        qr:
          type: string
          description: The URI as a PNG data URL.
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    User:
      type: object
      required: [id, email, name, role, created_at]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
    MatchMode:
      type: string
      enum: [whole_word, self_anywhere]
      description: whole_word matches every brand's name and aliases as whole words, case-sensitive. self_anywhere also counts your brand's name anywhere in the text, ignoring case, and keeps other brands whole-word.
    BrandKind:
      type: string
      enum: [self, competitor, technology]
      description: self is your own brand, set with PUT /v1/settings. A technology is found in answers but never gets a position and never counts toward share of mentions.
    SurfaceKey:
      type: string
      enum: [chatgpt_app, gemini_app, google_ai_mode, google_ai_overview, copilot, bing_ai_mode, brave, claude_code, gemini_cli, codex_cli, claude_app, perplexity_app]
      description: A surface in Byname's registry. GET /v1/surfaces lists each with its title.
    Fidelity:
      type: string
      enum: [app, model_match, approximation]
      description: How closely a pair stands in for what people see. app is the real app or search page, read by a scraping provider. model_match is an API call with the model the team uses and the same web search, standing in for a developer tool. approximation is the closest option when neither holds, such as the Claude API standing in for the Claude app.
    SearchControl:
      type: string
      enum: [by_app, forceable, enable_only, always, by_model]
      description: How the route searches the web. by_app means the scraped app decides for itself. forceable means force_web_search makes the model search, on the models that accept it. enable_only means search is on but cannot be forced. always means the model searches on every call. by_model means a gateway passes no search option and the model decides.
    Route:
      type: string
      enum: [treg, scraper, provider, gateway]
      description: How a surface's calls reach a provider. treg calls the pinned endpoint through Treg with the one Treg token. scraper calls the same endpoint at its own provider (DataForSEO, cloro or SerpApi) with that provider's key, so an app surface stays app. provider calls a model API directly (OpenAI, Anthropic, Google or Perplexity), and gateway an OpenAI-compatible gateway; on either an app surface is only an approximation.
    CredentialKind:
      type: string
      enum: [treg, openai, anthropic, perplexity, google, dataforseo, cloro, serpapi, gateway]
    StepKey:
      type: string
      enum: [brand, competitors, questions, surfaces, search, social, schedule, review]
    AnswerStatus:
      type: string
      enum: [ok, no_answer, failed]
      description: ok is an answer. no_answer means the surface showed no AI answer, such as a Google search with no AI Overview. It is a valid result that names nobody. failed means the provider gave no usable answer, and error says why.
    RunStatus:
      type: string
      enum: [queued, running, completed, capped, refused, failed]
      description: A run moves from queued to running, then ends completed, capped, refused or failed. capped means the run or month spend cap stopped it queueing calls. refused means Treg refused a call on its own behalf, such as for an insufficient balance, and the run stopped.
    Trigger:
      type: string
      enum: [scheduled, run_now]
    Outcome:
      type: string
      enum: [gained, lost, moved, unchanged, not_comparable]
      description: gained means the after run named you and the before run did not, and lost the reverse. moved means both named you at different positions. not_comparable means the pair is missing from one run, failed in either, changed endpoint or fidelity, or its question has no successor in the newer set.
    SelfBrand:
      type: object
      description: Your own brand.
      required: [name, aliases, domains]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        aliases:
          type: array
          items:
            type: string
          description: Other names that count as a mention of you.
        domains:
          type: array
          minItems: 1
          items:
            type: string
          description: Hostnames, the first your primary domain. A link to any of them or their subdomains is a citation of you.
    Settings:
      type: object
      description: Your brand, market, schedule, spend caps and call limits.
      required: [brand, match_mode, market, language, time_zone, check_every_days, check_time, spend_cap_run_usd, spend_cap_month_usd, concurrency, retries, timeout_s, samples, raw_retention_days]
      properties:
        brand:
          $ref: "#/components/schemas/SelfBrand"
        match_mode:
          $ref: "#/components/schemas/MatchMode"
        market:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 country, such as US.
        language:
          type: string
          pattern: "^[a-z]{2}$"
          description: ISO 639-1 language, such as en.
        time_zone:
          type: string
          description: IANA time zone, such as Europe/Berlin. check_time is in it.
        check_every_days:
          type: integer
          minimum: 1
          maximum: 30
        check_time:
          type: string
          pattern: "^[0-9]{2}:[0-9]{2}$"
          description: HH:MM in time_zone, such as 06:00.
        spend_cap_run_usd:
          type: number
          exclusiveMinimum: 0
          description: A check stops queueing calls once it has spent this much.
        spend_cap_month_usd:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: Once the calendar month's checks have spent this much, no check starts and a running check queues no more calls. Null for no cap.
        concurrency:
          type: integer
          minimum: 1
          maximum: 32
          description: Calls in flight at once.
        retries:
          type: integer
          minimum: 0
          maximum: 3
          description: Retries per failed call.
        timeout_s:
          type: integer
          minimum: 30
          maximum: 600
          description: Seconds per call.
        samples:
          type: integer
          minimum: 1
          maximum: 5
          default: 1
          description: Times a check asks each question on each AI app and model. More answers tighten the bands and make a move easier to trust, and each one is another paid answer. Left out, it is 1.
        raw_retention_days:
          type: [integer, "null"]
          minimum: 1
          description: Days to keep raw responses. Null keeps them forever.
    SettingsView:
      description: The settings with the schedule's state.
      allOf:
        - $ref: "#/components/schemas/Settings"
        - type: object
          required: [checks_paused, next_check_at, last_check_at, last_check, next_check, updated_at, onboarded_at, branded_terms, branded_terms_default]
          properties:
            checks_paused:
              type: boolean
              description: Scheduled checks are paused. Run now still works.
            next_check_at:
              type: [string, "null"]
              format: date-time
              description: When the next scheduled check is due. Null until onboarding is finished, so nothing runs on schedule before.
            last_check_at:
              type: [string, "null"]
              format: date-time
              description: When the schedule last fired, even when that check was skipped. Null before the first. Run now does not move it; last_check is the latest check whatever started it.
            last_check:
              description: The latest check, whether the schedule, Run now or Start first check started it. Null before the first.
              oneOf:
                - type: "null"
                - type: object
                  required: [run_id, trigger, status, queued_at, started_at, finished_at]
                  properties:
                    run_id:
                      type: integer
                    trigger:
                      $ref: "#/components/schemas/Trigger"
                    status:
                      $ref: "#/components/schemas/RunStatus"
                    queued_at:
                      type: string
                      format: date-time
                    started_at:
                      type: [string, "null"]
                      format: date-time
                    finished_at:
                      type: [string, "null"]
                      format: date-time
            next_check:
              description: The next scheduled check in the instance's time zone, so the app can say "tomorrow at 06:00, then every 3 days". Null while paused or before onboarding is finished.
              oneOf:
                - type: "null"
                - type: object
                  required: [at, local_date, local_time, days_away, then_every_days]
                  properties:
                    at:
                      type: string
                      format: date-time
                    local_date:
                      type: string
                      format: date
                      description: The day in time_zone.
                    local_time:
                      type: string
                      description: HH:MM in time_zone.
                    days_away:
                      type: integer
                      minimum: 0
                      description: Calendar days from today in time_zone. 0 is today, 1 tomorrow.
                    then_every_days:
                      type: integer
            updated_at:
              type: string
              format: date-time
            onboarded_at:
              type: [string, "null"]
              format: date-time
              description: When onboarding was finished. Null before.
            branded_terms:
              type: array
              items:
                type: string
              description: Lowercased. A Search Console query containing one is brand. Set with PUT /v1/settings/branded-terms.
            branded_terms_default:
              type: boolean
              description: True while the terms are your brand's name and aliases.
    Brand:
      type: object
      required: [id, name, aliases, domains, kind]
      properties:
        id:
          type: integer
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        domains:
          type: array
          items:
            type: string
          description: Hostnames, the first the primary domain. A link to any of them or their subdomains is a citation of the brand.
        kind:
          $ref: "#/components/schemas/BrandKind"
    BrandInput:
      type: object
      description: A competitor or technology. Names are unique ignoring case.
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        aliases:
          type: array
          items:
            type: string
          description: Other names that count as a mention of the brand.
        domains:
          type: array
          items:
            type: string
          description: Hostnames only, such as example.com, without a scheme or path.
        kind:
          type: string
          enum: [competitor, technology]
          default: competitor
    Question:
      type: object
      required: [id, group, text, names_brand, count_in_scores]
      properties:
        id:
          type: integer
          description: Unique to this version. A question carried on into the next version gets a new id there.
        group:
          type: string
          description: A label that groups related questions. A question can be a group of one.
        text:
          type: string
          description: Sent to every surface as written.
        names_brand:
          type: boolean
          description: The text names your brand, by the rules answers are scored with.
        count_in_scores:
          type: boolean
          description: Whether its answers count in scores. False by default when the text names your brand, true otherwise. Set with PUT /v1/questions/{id}/scoring.
    QuestionScoringInput:
      type: object
      required: [count_in_scores]
      additionalProperties: false
      properties:
        count_in_scores:
          type: [boolean, "null"]
          description: True to count its answers in scores, false to leave them out, null for the default.
    NamingCheckInput:
      type: object
      additionalProperties: false
      properties:
        questions:
          type: array
          maxItems: 100
          description: Question texts to check against the brand table.
          items:
            type: string
        aliases:
          type: array
          maxItems: 50
          description: Brand names or aliases to check for common words.
          items:
            type: string
    NamingCheck:
      type: object
      required: [brand, questions, aliases]
      properties:
        brand:
          type: string
          description: Your brand's name. Empty before it is set.
        questions:
          type: array
          items:
            type: object
            required: [text, names_brand, brands]
            properties:
              text:
                type: string
              names_brand:
                type: boolean
                description: The text names your brand, so its answers are left out of scores by default.
              brands:
                type: array
                description: Every brand the text names, yours and competitors', in order of first mention.
                items:
                  type: string
        aliases:
          type: array
          items:
            type: object
            required: [alias, common_word]
            properties:
              alias:
                type: string
              common_word:
                type: boolean
                description: A common English word, so everyday text would count as naming the brand.
    QuestionLink:
      type: object
      required: [from, to]
      properties:
        from:
          type: integer
          description: A question of the previous version.
        to:
          type: integer
          description: The question of this version that carries it on.
    QuestionSet:
      type: object
      description: One version of the questions. carried and retired account for every question of the previous version, and both are empty for the first version.
      required: [id, version, notes, created_at, questions, carried, retired]
      properties:
        id:
          type: integer
        version:
          type: integer
          description: 1 for the first set, then one more for each change.
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        carried:
          type: array
          items:
            $ref: "#/components/schemas/QuestionLink"
          description: Which question of the previous version each question carries on.
        retired:
          type: array
          items:
            type: integer
          description: Questions of the previous version that ended with this version.
    QuestionSetSummary:
      type: object
      required: [id, version, notes, created_at, questions]
      properties:
        id:
          type: integer
        version:
          type: integer
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        questions:
          type: integer
          description: How many questions the version has.
    QuestionInput:
      type: object
      required: [group, text]
      additionalProperties: false
      properties:
        group:
          type: string
          minLength: 1
          maxLength: 80
        text:
          type: string
          minLength: 10
          maxLength: 300
          description: Sent to every surface as written. Unique in the set, ignoring case and punctuation.
        replaces:
          type: array
          items:
            type: integer
          description: Current question ids this question carries on, when their text changed. A current question carries on into at most one question.
    QuestionsInput:
      type: object
      description: The whole new set. A question whose text matches a current question, ignoring case and punctuation, carries that one on by itself. Every other current question must be named in some question's replaces or in retired, so history never breaks silently.
      required: [questions]
      additionalProperties: false
      properties:
        notes:
          type: string
          description: Why this version changed, shown in the version list.
        questions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/QuestionInput"
        retired:
          type: array
          items:
            type: integer
          description: Current question ids that end with this version.
    Pair:
      type: object
      description: A surface and model pair. Each pair is its own series with its own fidelity.
      required: [id, surface, model, fidelity, force_web_search, enabled, paused_reason, last_tested_at, test_status, test_searched]
      properties:
        id:
          type: integer
        surface:
          $ref: "#/components/schemas/SurfaceKey"
        model:
          type: string
          description: Empty where the app picks the model.
        fidelity:
          $ref: "#/components/schemas/Fidelity"
        force_web_search:
          type: boolean
        enabled:
          type: boolean
        paused_reason:
          type: string
          description: Set when the model left the route's live model list, and empty otherwise. A paused pair is skipped until the model is back.
        last_tested_at:
          type: [string, "null"]
          format: date-time
          description: Null until tested, and again after the surface moves to another route.
        test_status:
          type: string
          description: Empty until tested, ok after a test call that answered, or why the last test failed.
        test_searched:
          type: [boolean, "null"]
          description: Whether the last test call's answer searched the web. Null until tested.
    Surface:
      type: object
      description: One registry surface with how this instance uses it. endpoint, fidelity, takes_model and search are on the current route.
      required: [key, title, group, endpoint, fidelity, takes_model, search, route, credential, base_url, routes, enabled, default_on, pairs]
      properties:
        key:
          $ref: "#/components/schemas/SurfaceKey"
        title:
          type: string
        group:
          type: string
          enum: [apps, developer_tools, approximations]
          description: How onboarding groups surfaces.
        endpoint:
          type: string
          description: The endpoint id answers on the current route store. Changing it starts a new series.
        fidelity:
          allOf:
            - $ref: "#/components/schemas/Fidelity"
          description: The label on the current route before a test. Each pair carries its own.
        takes_model:
          type: boolean
          description: False on app surfaces read by Treg or a scraping key, where the app picks the model.
        search:
          $ref: "#/components/schemas/SearchControl"
        route:
          $ref: "#/components/schemas/Route"
        credential:
          allOf:
            - $ref: "#/components/schemas/CredentialKind"
          description: The key the current route calls with.
        base_url:
          type: string
          description: The gateway's base URL, empty off the gateway route.
        routes:
          type: array
          items:
            $ref: "#/components/schemas/RouteOption"
          description: Every route the surface can take, Treg first.
        enabled:
          type: boolean
        default_on:
          type: boolean
          description: Ticked by default in onboarding.
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/Pair"
          description: Every model pair the surface has had, enabled or not.
    RouteOption:
      type: object
      description: One way a surface can be asked, with the label its pairs get there before a test.
      required: [route, credential, provider, fidelity, takes_model, search]
      properties:
        route:
          $ref: "#/components/schemas/Route"
        credential:
          $ref: "#/components/schemas/CredentialKind"
        provider:
          type: string
        fidelity:
          $ref: "#/components/schemas/Fidelity"
        takes_model:
          type: boolean
        search:
          $ref: "#/components/schemas/SearchControl"
    PairInput:
      type: object
      required: [model]
      additionalProperties: false
      properties:
        model:
          type: string
          description: A name on the route's live model list, from GET /v1/surfaces/{key}/models.
        force_web_search:
          type: [boolean, "null"]
          description: Omit or send null for the default, which is true where the endpoint can force search. Only a forceable endpoint takes true.
    SurfaceInput:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        route:
          allOf:
            - $ref: "#/components/schemas/Route"
          description: Omit to keep the current route.
        base_url:
          type: string
          description: The gateway's base URL, such as https://openrouter.ai/api/v1. Gateway route only.
        models:
          type: array
          items:
            $ref: "#/components/schemas/PairInput"
          description: The models to enable. The surface's other models are disabled. Omit to keep its models as they are, except when moving to a route that takes models. App surfaces read by Treg or a scraping key take none.
    Model:
      type: object
      description: One name on an endpoint's live model list.
      required: [name, web_search]
      properties:
        name:
          type: string
        web_search:
          type: boolean
          description: The model can search the web on this endpoint.
    Credential:
      type: object
      description: What Byname shows about a stored key. No response ever carries the key itself.
      required: [kind, title, hint, set, org, last_tested_at, last_test_status, updated_at, used_by]
      properties:
        kind:
          $ref: "#/components/schemas/CredentialKind"
        title:
          type: string
        hint:
          type: string
          description: What to paste.
        set:
          type: boolean
        org:
          type: string
          description: Treg's X-Treg-Org, empty unless a personal token needs it.
        last_tested_at:
          type: [string, "null"]
          format: date-time
          description: Null until tested, and again after the key is replaced.
        last_test_status:
          type: string
          description: ok, why the last test failed, or that the provider has no free call to test with. Empty until tested.
        updated_at:
          type: [string, "null"]
          format: date-time
          description: Null while no key is set.
        used_by:
          type: array
          items:
            $ref: "#/components/schemas/SurfaceKey"
          description: Surfaces whose route calls with this key.
    Onboarding:
      type: object
      required: [steps, finished_at, missing, first_scheduled_check]
      properties:
        steps:
          type: array
          items:
            type: object
            required: [key, title, saved, required]
            properties:
              key:
                $ref: "#/components/schemas/StepKey"
              title:
                type: string
              saved:
                type: boolean
              required:
                type: boolean
        finished_at:
          type: [string, "null"]
          format: date-time
        missing:
          type: array
          items:
            type: string
          description: What still blocks finishing, in plain words. Empty once finished.
        first_scheduled_check:
          description: The scheduled check finishing now would set, in the instance's time zone, so the review can say when the second check runs. Null once finished.
          oneOf:
            - type: "null"
            - type: object
              required: [at, local_date, local_time, days_away, then_every_days]
              properties:
                at:
                  type: string
                  format: date-time
                local_date:
                  type: string
                  format: date
                  description: The day in time_zone.
                local_time:
                  type: string
                  description: HH:MM in time_zone.
                days_away:
                  type: integer
                  minimum: 0
                  description: Calendar days from today in time_zone. 0 is today, 1 tomorrow.
                then_every_days:
                  type: integer
    PairTest:
      type: object
      required: [pair, status, error, cost_usd, cost_reported, searched, cited, citations, reported_model]
      properties:
        pair:
          $ref: "#/components/schemas/Pair"
        status:
          $ref: "#/components/schemas/AnswerStatus"
        error:
          type: string
        cost_usd:
          type: [number, "null"]
          description: Null when the route reported no cost, as token-billed APIs do. Never estimated.
        cost_reported:
          type: boolean
        searched:
          type: boolean
        cited:
          type: boolean
        citations:
          type: integer
        reported_model:
          type: string
    Estimate:
      type: object
      required: [questions, pairs, samples, calls, known_usd, unknown_pairs, rows, find_brands]
      properties:
        questions:
          type: integer
        pairs:
          type: integer
        samples:
          type: integer
          description: Times a check asks each question on each pair, from the settings.
        calls:
          type: integer
          description: Questions times enabled pairs times samples.
        known_usd:
          type: number
          description: The sum over pairs with a cost per call, plus reading the answers for other brands when that is on.
        unknown_pairs:
          type: integer
        find_brands:
          type: ["object", "null"]
          description: Reading each answer for the brands it names that you don't track. Null while it is off or no Treg token is stored.
          required: [answers, cost_per_answer_usd, cost_usd]
          properties:
            answers:
              type: integer
            cost_per_answer_usd:
              type: number
              description: The mean of past reads, or the sampled price before any.
            cost_usd:
              type: number
        rows:
          type: array
          items:
            type: object
            required: [pair_id, surface, title, model, fidelity, route, endpoint, calls, cost_per_call_usd, source, samples, cost_usd]
            properties:
              pair_id:
                type: integer
              surface:
                $ref: "#/components/schemas/SurfaceKey"
              title:
                type: string
              model:
                type: string
              fidelity:
                $ref: "#/components/schemas/Fidelity"
              route:
                $ref: "#/components/schemas/Route"
              endpoint:
                type: string
              calls:
                type: integer
              cost_per_call_usd:
                type: [number, "null"]
              source:
                type: string
                enum: [history, sample, unknown]
                description: history is the mean reported cost of the endpoint's past answers, sample the endpoint's sampled cost.
              samples:
                type: integer
                description: Past answers averaged, for history.
              cost_usd:
                type: [number, "null"]
    Costs:
      type: object
      required: [per_answer, checks, social, other_brands, month_estimate_usd, default_month_cap_usd, month]
      properties:
        per_answer:
          type: array
          description: One answer on each surface, on its current route, in onboarding order.
          items:
            type: object
            required: [surface, title, group, route, endpoint, enabled, default_on, models, cost_per_answer_usd, source, samples]
            properties:
              surface:
                $ref: "#/components/schemas/SurfaceKey"
              title:
                type: string
              group:
                type: string
                enum: [apps, developer_tools, approximations]
              route:
                $ref: "#/components/schemas/Route"
              endpoint:
                type: string
              enabled:
                type: boolean
              default_on:
                type: boolean
                description: Ticked by default in onboarding.
              models:
                type: array
                description: The models turned on, each charged this per answer. Empty on an app surface.
                items:
                  type: string
              cost_per_answer_usd:
                type: [number, "null"]
                description: Null when no past answer reported a cost and the route has no sampled price.
              source:
                type: string
                enum: [history, sample, unknown]
                description: history is the mean reported cost of the endpoint's past answers, sample the registry's sampled price.
              samples:
                type: integer
        checks:
          type: object
          required: [check, check_every_days, paused, checks_per_month, month_usd]
          properties:
            check:
              $ref: "#/components/schemas/Estimate"
            check_every_days:
              type: integer
            paused:
              type: boolean
              description: Scheduled checks are paused, so none runs on its own.
            checks_per_month:
              type: number
              description: Scheduled checks in an average month, 0 while paused. Check now adds to it.
            month_usd:
              type: number
              description: One check's known cost times checks_per_month.
        social:
          type: object
          required: [enabled, fetches_per_month, terms, treg_networks, treg_per_fetch_usd, treg_month_usd, bluesky_on, bluesky_month_usd, month_usd]
          description: Social searches at their current settings, counting one call per network and term each fetch. A first fetch pages back further and costs more.
          properties:
            enabled:
              type: boolean
            fetches_per_month:
              type: number
            terms:
              type: integer
            treg_networks:
              type: integer
              description: Networks on that are searched through Treg. 0 without a Treg token.
            treg_per_fetch_usd:
              type: number
            treg_month_usd:
              type: number
              description: What the Treg networks cost a month at these settings, whether social is on or not.
            bluesky_on:
              type: boolean
            bluesky_month_usd:
              type: number
              description: Always 0. Bluesky's own API is free.
            month_usd:
              type: number
              description: treg_month_usd while social is on, 0 while it is off.
        other_brands:
          $ref: "#/components/schemas/OtherBrandsSettings"
        month_estimate_usd:
          type: number
          description: checks.month_usd plus social.month_usd. Reading answers for other brands is in each check's estimate; logo lookups are capped by other_brands.logos.month_max_usd.
        default_month_cap_usd:
          type: number
          description: The monthly spend cap finishing onboarding sets when none is set. Three times month_estimate_usd, rounded up to a whole dollar, and at least 5.
        month:
          type: object
          required: [start, checks_usd, social_usd, brands_usd, spent_usd, missing_cost_calls, cap_usd]
          description: The calendar month so far, in the instance's time zone.
          properties:
            start:
              type: string
              format: date-time
            checks_usd:
              type: number
            social_usd:
              type: number
            brands_usd:
              type: number
              description: Finding other brands, reading answers in checks or later and looking up logos.
            spent_usd:
              type: number
              description: checks_usd plus social_usd plus brands_usd, what the monthly spend cap counts.
            missing_cost_calls:
              type: integer
              description: Answered calls this month that reported no cost, so spent_usd is a floor.
            cap_usd:
              type: [number, "null"]
              description: The monthly spend cap. Null for none.
    QueuedRun:
      type: object
      description: A queued or running check, as Run now reports it. GET /v1/runs/{id} has its progress and spend.
      required: [id, status, trigger, question_set_id, queued_at]
      properties:
        id:
          type: integer
        status:
          $ref: "#/components/schemas/RunStatus"
        trigger:
          $ref: "#/components/schemas/Trigger"
        question_set_id:
          type: integer
          description: The question set version the run asks.
        queued_at:
          type: string
          format: date-time
    EndpointStats:
      type: object
      description: One endpoint's calls in a run, so a flaky provider shows up as a provider problem, not a visibility drop.
      required: [endpoint, calls, succeeded, success_rate, cost_usd, missing_cost, cost_per_call]
      properties:
        endpoint:
          type: string
        calls:
          type: integer
        succeeded:
          type: integer
          description: Calls that did not fail.
        success_rate:
          type: number
          minimum: 0
          maximum: 1
          description: succeeded over calls.
        cost_usd:
          type: number
          description: What the calls that reported a cost spent. missing_cost counts the ones that did not.
        missing_cost:
          type: integer
          description: Answered calls that reported no cost. Their cost is unknown, not $0.
        cost_per_call:
          type: [number, "null"]
          description: Over calls that reported a cost. Null when none did.
    Run:
      type: object
      description: One check with what it cost and how each endpoint did.
      required: [id, status, trigger, question_set_id, question_set_version, queued_at, started_at, finished_at, spend_usd, spend_missing_calls, calls, succeeded, scored, mentioned, cited, error, refusal_code, endpoints]
      properties:
        id:
          type: integer
        status:
          $ref: "#/components/schemas/RunStatus"
        trigger:
          $ref: "#/components/schemas/Trigger"
        question_set_id:
          type: integer
        question_set_version:
          type: integer
        queued_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        spend_usd:
          type: number
          description: What the calls that reported a cost spent. spend_missing_calls counts the ones that did not.
        spend_missing_calls:
          type: integer
          description: Answered calls that reported no cost. Their cost is unknown, not $0.
        calls:
          type: integer
          description: Answers stored, failed ones included.
        succeeded:
          type: integer
          description: Answers that did not fail.
        scored:
          type: integer
          description: Answers that did not fail and count in scores. Answers to a question that names your brand are left out unless it is counted anyway.
        mentioned:
          type: integer
          description: Of the scored answers, those that named you.
        cited:
          type: integer
          description: Of the scored answers, those that cited one of your domains. Counted apart from mentioned.
        error:
          type: string
          description: Why the run stopped early, if it did. Empty otherwise.
        refusal_code:
          type: string
          description: Treg's error code when it refused a call. Empty otherwise.
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/EndpointStats"
    QuestionRef:
      type: object
      required: [id, group, text, counts_in_scores]
      properties:
        id:
          type: integer
        group:
          type: string
        text:
          type: string
        counts_in_scores:
          type: boolean
          description: False when its answers are left out of scores, as for a question that names your brand. Its answers are still shown.
    PairRef:
      type: object
      description: Names a surface and model pair.
      required: [id, surface, model]
      properties:
        id:
          type: integer
        surface:
          $ref: "#/components/schemas/SurfaceKey"
        model:
          type: string
          description: Empty on app surfaces.
    Mention:
      type: object
      description: A brand an answer named.
      required: [brand_id, name, kind, position]
      properties:
        brand_id:
          type: integer
        name:
          type: string
        kind:
          $ref: "#/components/schemas/BrandKind"
        position:
          type: [integer, "null"]
          minimum: 1
          description: The order of first mention among brands that are not technologies, 1 first. Null for a technology.
    Citation:
      type: object
      required: [url, domain, is_self, page]
      properties:
        url:
          type: string
        domain:
          type: string
        is_self:
          type: boolean
          description: The link is on one of your domains or their subdomains.
        page:
          oneOf:
            - $ref: "#/components/schemas/PageCheck"
            - type: "null"
          description: What the cited page said the last time Byname read it. Null until it has been fetched.
    AnswerSummary:
      type: object
      description: One answer as the answers list shows it.
      required: [id, run_id, question, pair, sample, endpoint, fidelity, reported_model, status, error, attempts, mentioned, cited, position, cost_usd, citation_count, mentions, others, answered_at]
      properties:
        id:
          type: integer
        run_id:
          type: integer
        question:
          $ref: "#/components/schemas/QuestionRef"
        pair:
          $ref: "#/components/schemas/PairRef"
        sample:
          type: integer
          minimum: 1
          description: Which of the times the check asked this question on this pair, from 1. See samples in the settings.
        endpoint:
          type: string
        fidelity:
          $ref: "#/components/schemas/Fidelity"
        reported_model:
          type: string
          description: The exact model name the endpoint reported. Empty when it reported none.
        status:
          $ref: "#/components/schemas/AnswerStatus"
        error:
          type: string
          description: Why the call failed. Empty otherwise.
        attempts:
          type: integer
        mentioned:
          type: boolean
          description: The answer names you.
        cited:
          type: boolean
          description: The answer links to one of your domains. Independent of mentioned.
        position:
          type: [integer, "null"]
          minimum: 1
          description: Your position among the brands named, 1 first. Null when the answer does not name you.
        cost_usd:
          type: [number, "null"]
          description: Null when the call reported no cost, which means unknown, never $0.
        citation_count:
          type: integer
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/Mention"
          description: Every brand named, in order of first mention.
        others:
          type: array
          description: The brands the answer named that you don't track, in answer order. They count in no score.
          items:
            type: object
            required: [brand_id, name]
            properties:
              brand_id:
                type: integer
              name:
                type: string
        answered_at:
          type: string
          format: date-time
    Answer:
      description: One answer in full, with its text, raw response and citations.
      allOf:
        - $ref: "#/components/schemas/AnswerSummary"
        - type: object
          required: [text, raw, fan_out, citations, call_id]
          properties:
            text:
              type: string
            raw:
              description: The provider's response body as any JSON value. Null once past raw_retention_days.
            fan_out:
              type: array
              items:
                type: string
              description: The engine's own web searches, where the endpoint exposes them.
            citations:
              type: array
              items:
                $ref: "#/components/schemas/Citation"
              description: Cited URLs in answer order.
            call_id:
              type: string
              description: Treg's id for the call.
    Series:
      type: object
      description: One line on a chart. A series is one surface and model pair on one endpoint at one fidelity. Changing the endpoint or the fidelity starts a new series, and no number averages across series.
      required: [pair, endpoint, fidelity]
      properties:
        pair:
          $ref: "#/components/schemas/PairRef"
        endpoint:
          type: string
        fidelity:
          $ref: "#/components/schemas/Fidelity"
    Standing:
      type: object
      description: One pair's answers to a question in one run, as compare shows it. Asked several times, it says what most of the answers say.
      required: [answer_id, answer_ids, status, mentioned, cited, position, answered, named]
      properties:
        answer_id:
          type: integer
          description: The first sample's answer.
        answer_ids:
          type: array
          items:
            type: integer
          description: Every sample's answer, in sample order.
        status:
          $ref: "#/components/schemas/AnswerStatus"
          description: Failed only when every answer failed.
        mentioned:
          type: boolean
          description: Most answers named you.
        cited:
          type: boolean
          description: Most answers cited your domains.
        position:
          type: [integer, "null"]
          minimum: 1
          description: Your best position among the answers that named you, 1 first. Null when none did.
        answered:
          type: integer
          description: Answers that did not fail.
        named:
          type: integer
          description: Answers that named you.
    PairChange:
      type: object
      required: [question_id, pair_id, question, pair, outcome, before, after]
      properties:
        question_id:
          type: integer
          description: In the after run's question set, except for an older question with no successor, which keeps its own id.
        pair_id:
          type: integer
        question:
          $ref: "#/components/schemas/QuestionRef"
        pair:
          $ref: "#/components/schemas/PairRef"
        outcome:
          $ref: "#/components/schemas/Outcome"
        before:
          oneOf:
            - $ref: "#/components/schemas/Standing"
            - type: "null"
          description: Null when the pair has no answer in the before run.
        after:
          oneOf:
            - $ref: "#/components/schemas/Standing"
            - type: "null"
          description: Null when the pair has no answer in the after run.
    Band:
      type: object
      description: A 95% Wilson score band on a rate, treating each answer as an independent draw.
      required: [low, high]
      properties:
        low:
          type: number
          minimum: 0
          maximum: 1
        high:
          type: number
          minimum: 0
          maximum: 1
    Move:
      type: object
      description: Whether the share of answers naming you moved between two runs by more than chance gives. Each question and pair is compared with itself across the runs, answers that started naming you weighed against ones that stopped.
      required: [cells, before_rate, after_rate, p_value, real]
      properties:
        cells:
          type: integer
          description: Question and pair cells compared, those answered in both runs and counted in scores.
        before_rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Named over answered across those cells in the earlier run. Null when no cell compares.
        after_rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Named over answered across those cells in the later run. Null when no cell compares.
        p_value:
          type: number
          minimum: 0
          maximum: 1
          description: The chance of a move at least this large if nothing changed. 1 when no answer flipped.
        real:
          type: boolean
          description: True when p_value is under 0.05.
    Comparison:
      type: object
      description: Every question and pair across two runs, with counts per outcome, the net change and whether the share of answers naming you really moved.
      required: [before, after, counts, net, move, pairs]
      properties:
        before:
          type: integer
          description: The before run's id.
        after:
          type: integer
          description: The after run's id.
        counts:
          type: object
          description: How many question and pair entries had each outcome.
          required: [gained, lost, moved, unchanged, not_comparable]
          additionalProperties: false
          properties:
            gained:
              type: integer
            lost:
              type: integer
            moved:
              type: integer
            unchanged:
              type: integer
            not_comparable:
              type: integer
        net:
          type: integer
          description: gained minus lost.
        move:
          $ref: "#/components/schemas/Move"
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/PairChange"
          description: Ordered by question, then pair.
    Point:
      type: object
      description: One pair's answers to a question in one run. Asked several times, it says what most of the answers say. Plot points by run, not by day.
      required: [run_id, run_started_at, answer_id, answer_ids, question_id, status, mentioned, cited, position, answered, named, reported_model, summary]
      properties:
        run_id:
          type: integer
        run_started_at:
          type: string
          format: date-time
          description: When the run started, or was queued if it never started.
        answer_id:
          type: integer
          description: The first sample's answer.
        answer_ids:
          type: array
          items:
            type: integer
          description: Every sample's answer, in sample order.
        question_id:
          type: integer
          description: The question as that run asked it, which may be an earlier version's.
        status:
          $ref: "#/components/schemas/AnswerStatus"
          description: Failed only when every answer failed.
        mentioned:
          type: boolean
          description: Most answers named you.
        cited:
          type: boolean
          description: Most answers cited your domains.
        position:
          type: [integer, "null"]
          minimum: 1
          description: Your best position among the answers that named you, 1 first. Null when none did.
        answered:
          type: integer
          description: Answers that did not fail.
        named:
          type: integer
          description: Answers that named you.
        reported_model:
          type: string
          description: The model the first sample's answer reported.
        summary:
          type: string
          description: 'The change since this series''s previous run, such as "Gained mention at #1 · Northwind cited · Dropped: Contoso".'
    HistorySeries:
      allOf:
        - $ref: "#/components/schemas/Series"
        - type: object
          required: [answered, named, cited, best_position, points]
          properties:
            answered:
              type: integer
              description: Runs whose answers did not all fail.
            named:
              type: integer
              description: Runs where most answers named you.
            cited:
              type: integer
              description: Runs where most answers cited your domains.
            best_position:
              type: [integer, "null"]
              minimum: 1
              description: Your best position over these runs. Null when never named.
            points:
              type: array
              items:
                $ref: "#/components/schemas/Point"
              description: Oldest run first.
    History:
      type: object
      required: [question_id, question, series]
      properties:
        question_id:
          type: integer
        question:
          $ref: "#/components/schemas/QuestionRef"
          description: The question as it reads now.
        series:
          type: array
          items:
            $ref: "#/components/schemas/HistorySeries"
          description: One per pair, endpoint and fidelity. A pair's series stay in the order they began, oldest first.
    RatePoint:
      type: object
      description: One series in one run. Rates are over answered calls, failed ones excluded.
      required: [run_id, run_started_at, calls, answered, mentioned, cited, mention_rate, citation_rate, mention_band, citation_band]
      properties:
        run_id:
          type: integer
        run_started_at:
          type: string
          format: date-time
          description: When the run started, or was queued if it never started.
        calls:
          type: integer
        answered:
          type: integer
          description: Calls that did not fail, no_answer included.
        mentioned:
          type: integer
        cited:
          type: integer
        mention_rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: mentioned over answered. Null when none answered.
        citation_rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: cited over answered, counted apart from mentions. Null when none answered.
        mention_band:
          oneOf:
            - $ref: "#/components/schemas/Band"
            - type: "null"
          description: The 95% band on mention_rate. Null when none answered.
        citation_band:
          oneOf:
            - $ref: "#/components/schemas/Band"
            - type: "null"
          description: The 95% band on citation_rate. Null when none answered.
    RateSeries:
      allOf:
        - $ref: "#/components/schemas/Series"
        - type: object
          required: [models, points]
          properties:
            models:
              type: array
              items:
                type: string
              description: The models the line combines. One on a pair line, none on an app surface, which picks its own.
            points:
              type: array
              items:
                $ref: "#/components/schemas/RatePoint"
              description: One per run, oldest first. Plot by run, not by day.
    BrandShare:
      type: object
      description: One brand's share of the brand mentions in a series' run.
      required: [brand_id, name, kind, mentions, share]
      properties:
        brand_id:
          type: integer
        name:
          type: string
        kind:
          type: string
          enum: [self, competitor]
          description: Technologies never count.
        mentions:
          type: integer
          description: How many answers named the brand.
        share:
          type: number
          minimum: 0
          maximum: 1
          description: mentions over the point's mentions.
    SharePoint:
      type: object
      required: [run_id, run_started_at, answered, mentions, brands]
      properties:
        run_id:
          type: integer
        run_started_at:
          type: string
          format: date-time
          description: When the run started, or was queued if it never started.
        answered:
          type: integer
        mentions:
          type: integer
          description: Mentions of you and your competitors, the share's denominator.
        brands:
          type: array
          items:
            $ref: "#/components/schemas/BrandShare"
          description: Most mentioned first.
    ShareSeries:
      allOf:
        - $ref: "#/components/schemas/Series"
        - type: object
          required: [points]
          properties:
            points:
              type: array
              items:
                $ref: "#/components/schemas/SharePoint"
              description: One per run, oldest first. Plot by run, not by day.
    RunSummary:
      type: object
      description: One run's headline over the pairs in scope. It counts pairs; it is not an average of line rates.
      required: [run_id, run_started_at, answered, mentioned, cited, mention_rate, citation_rate, mention_band, citation_band, mentions, share]
      properties:
        run_id:
          type: integer
        run_started_at:
          type: string
          format: date-time
          description: When the run started, or was queued if it never started.
        answered:
          type: integer
          description: Question and pair answers that did not fail.
        mentioned:
          type: integer
          description: Answers that named you.
        cited:
          type: integer
          description: Answers that cited your domains.
        mention_rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: mentioned over answered. Null when none answered.
        citation_rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: cited over answered. Null when none answered.
        mention_band:
          oneOf:
            - $ref: "#/components/schemas/Band"
            - type: "null"
          description: The 95% band on mention_rate. Null when none answered.
        citation_band:
          oneOf:
            - $ref: "#/components/schemas/Band"
            - type: "null"
          description: The 95% band on citation_rate. Null when none answered.
        mentions:
          type: integer
          description: Mentions of you and your competitors, the share's denominator.
        share:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Your mentions over mentions. Null when no brand was named.
    BrandStanding:
      type: object
      description: One brand's mentions over every run and line in range.
      required: [brand_id, name, kind, mentions, share, rank]
      properties:
        brand_id:
          type: integer
        name:
          type: string
        kind:
          type: string
          enum: [self, competitor]
          description: Technologies never count.
        mentions:
          type: integer
          description: Answers that named the brand.
        share:
          type: number
          minimum: 0
          maximum: 1
          description: mentions over every brand's mentions.
        rank:
          type: integer
          minimum: 0
          description: 1 for the most mentioned, shared by brands with equal mentions. 0 for a brand never named.
    HeatCell:
      type: object
      required: [brand_id, named, rate]
      properties:
        brand_id:
          type: integer
        named:
          type: integer
          description: Answers on this line that named the brand.
        rate:
          type: number
          minimum: 0
          maximum: 1
          description: named over the line's answered.
    HeatColumn:
      allOf:
        - $ref: "#/components/schemas/Series"
        - type: object
          required: [models, answered, cells]
          properties:
            models:
              type: array
              items:
                type: string
              description: The models the line combines. None on an app surface.
            answered:
              type: integer
            cells:
              type: array
              items:
                $ref: "#/components/schemas/HeatCell"
              description: One per brand the line's answers named. A brand missing here was named 0 times.
    Competitors:
      type: object
      required: [runs, answered, mentions, brands_named, brands, columns]
      properties:
        runs:
          type: integer
          description: Runs counted.
        answered:
          type: integer
          description: Question and pair answers that did not fail.
        mentions:
          type: integer
          description: Mentions of you and your competitors, the share's denominator.
        brands_named:
          type: integer
          description: Brands named at least once, the M in "your rank N of M".
        brands:
          type: array
          items:
            $ref: "#/components/schemas/BrandStanding"
          description: You and every competitor named, most mentioned first. You are listed even when never named.
        columns:
          type: array
          items:
            $ref: "#/components/schemas/HeatColumn"
          description: One per line, in pair order.
    Cell:
      type: object
      description: One pair's answers to one question. Asked several times, it says what most of the answers say.
      required: [answer_id, answer_ids, status, mentioned, cited, position, answered, named, outcome]
      properties:
        answer_id:
          type: integer
          description: The first sample's answer.
        answer_ids:
          type: array
          items:
            type: integer
          description: Every sample's answer, in sample order.
        status:
          $ref: "#/components/schemas/AnswerStatus"
          description: Failed only when every answer failed.
        mentioned:
          type: boolean
          description: Most answers named you.
        cited:
          type: boolean
          description: Most answers cited your domains.
        position:
          type: [integer, "null"]
          minimum: 1
          description: Your best position among the answers that named you, 1 first. Null when none did.
        answered:
          type: integer
          description: Answers that did not fail.
        named:
          type: integer
          description: Answers that named you.
        outcome:
          $ref: "#/components/schemas/Outcome"
    QuestionRow:
      type: object
      required: [question, cells, answered, named, cited, best_position, gained, lost, moved]
      properties:
        question:
          $ref: "#/components/schemas/QuestionRef"
        cells:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/Cell"
              - type: "null"
          description: One per column, in column order. Null where that pair has no answer to this question.
        answered:
          type: integer
          description: Cells that did not fail.
        named:
          type: integer
          description: Cells where most answers named you.
        cited:
          type: integer
          description: Cells where most answers cited your domains.
        best_position:
          type: [integer, "null"]
          minimum: 1
          description: Your best position in the row's answers. Null when none named you.
        gained:
          type: integer
          description: Cells that gained a mention since the previous run.
        lost:
          type: integer
        moved:
          type: integer
    QuestionTable:
      type: object
      required: [run_id, previous_run_id, columns, rows]
      properties:
        run_id:
          type: integer
        previous_run_id:
          type: [integer, "null"]
          description: The run changes count from, the latest earlier run with answers. Null on the first run.
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Series"
          description: One per pair, endpoint and fidelity in scope, in pair order.
        rows:
          type: array
          items:
            $ref: "#/components/schemas/QuestionRow"
          description: In question order.
    Gap:
      type: object
      description: A question where at least one pair did not name you in the run.
      required: [question, engines, named, competitors, opportunity, demand, named_on_miss, pairs, pages]
      properties:
        question:
          $ref: "#/components/schemas/QuestionRef"
        engines:
          type: integer
          description: How many pairs answered.
        named:
          type: integer
          description: How many of those pairs most answers named you on.
        competitors:
          type: integer
          description: Distinct competitors the answers named.
        opportunity:
          type: integer
          minimum: 0
          maximum: 5
          description: The share of pairs that did not name you times 3, plus up to 2 for search demand, which no source provides yet.
        demand:
          type: [integer, "null"]
          description: Monthly searches. Null until a demand source is configured.
        named_on_miss:
          type: array
          items:
            type: string
          description: Competitors named by the answers that did not name you, most often first.
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/GapPair"
          description: Each pair's answer, in pair order.
        pages:
          type: array
          items:
            $ref: "#/components/schemas/MarkedPage"
          description: Pages marked as answering this question, under any version of it, most recently marked first.
    MarkedPage:
      type: object
      description: A page marked as answering a question, as its row in the gaps shows it.
      required: [id, url, added_at, linked]
      properties:
        id:
          type: integer
        url:
          type: string
        added_at:
          type: string
          format: date-time
        linked:
          type: integer
          description: Answers since it was marked that link to it, to any question.
    QuestionPageInput:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          maxLength: 2000
          description: The page's address, such as https://northwind.example/blog/zero-downtime. https:// is assumed when left out.
    QuestionPage:
      type: object
      description: A page marked as answering a question.
      required: [id, question_id, url, added_at]
      properties:
        id:
          type: integer
        question_id:
          type: integer
        url:
          type: string
        added_at:
          type: string
          format: date-time
          description: When it was first marked. Answers from then on count as linking to it.
    Naming:
      type: object
      description: How one check's answers to a question named you.
      required: [run_id, run_started_at, answered, named]
      properties:
        run_id:
          type: integer
        run_started_at:
          type: string
          format: date-time
        answered:
          type: integer
          description: Answers that did not fail.
        named:
          type: integer
          description: Answers that named you.
    HandledPage:
      type: object
      description: A page marked as answering a question, and what happened since.
      required: [id, url, question, added_at, added_by, linked, before, now]
      properties:
        id:
          type: integer
        url:
          type: string
        question:
          $ref: "#/components/schemas/QuestionRef"
        added_at:
          type: string
          format: date-time
        added_by:
          type: string
          description: Who marked it. Empty for an API key or a person since removed.
        linked:
          type: object
          description: Every answer since the page was marked that links to it, to any question, from any AI app.
          required: [answers, questions, pairs, first_run_id, first_at, latest_run_id]
          properties:
            answers:
              type: integer
            questions:
              type: integer
              description: Distinct questions those answers were to.
            pairs:
              type: array
              items:
                $ref: "#/components/schemas/PairRef"
              description: The AI apps and models those answers came from, in pair order.
            first_run_id:
              type: [integer, "null"]
              description: The check that first linked to it. Null until one does.
            first_at:
              type: [string, "null"]
              format: date-time
            latest_run_id:
              type: [integer, "null"]
        before:
          description: The question's last check before the page was marked. Null when there was none.
          oneOf:
            - $ref: "#/components/schemas/Naming"
            - type: "null"
        now:
          description: The question's latest check since the page was marked. Null until one runs.
          oneOf:
            - $ref: "#/components/schemas/Naming"
            - type: "null"
    HandledPages:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          items:
            $ref: "#/components/schemas/HandledPage"
          description: Most recently marked first.
    Gaps:
      type: object
      required: [run_id, gaps]
      properties:
        run_id:
          type: integer
          description: The run ranked. 0 when no run has answers yet.
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/Gap"
          description: Highest opportunity first.
    Job:
      type: object
      description: One entry of the jobs log.
      required: [id, job, provider, trigger, run_id, status, started_at, finished_at, error, spend_usd]
      properties:
        id:
          type: integer
        job:
          type: string
          enum: [ai_check, model_refresh, source_fetch, search_sync, site_changes, recrawl_watch, verdicts, social_fetch, other_brands, brand_logos]
        provider:
          type: string
          description: The search engine a search_sync synced, such as google or bing. Empty for other jobs.
        trigger:
          $ref: "#/components/schemas/Trigger"
        run_id:
          type: [integer, "null"]
          description: The run, for an AI check.
        status:
          type: string
          enum: [queued, running, completed, capped, refused, failed, skipped]
          description: A run's statuses, plus skipped for a scheduled check that did not start, with error saying why.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        error:
          type: string
        spend_usd:
          type: [number, "null"]
          description: What the job spent. An AI check's answers and its reads for other brands, or the calls an other_brands or brand_logos job made. Null for a job that spends nothing.
    SearchTotals:
      type: object
      required: [clicks, impressions, ctr, position]
      properties:
        clicks:
          type: integer
        impressions:
          type: integer
        ctr:
          type: number
          description: Clicks over impressions, 0 to 1.
        position:
          type: number
          description: Average position, weighted by impressions over the rows that have one. 0 when there is none, as for Bing's site totals.
    SearchPeriod:
      description: The site's numbers over from to to, inclusive.
      allOf:
        - $ref: "#/components/schemas/SearchTotals"
        - type: object
          required: [from, to, days, brand_clicks, non_brand_clicks, unlisted_clicks, days_with_data]
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            days:
              type: integer
              description: The window's length, a whole number of the provider's step_days.
            brand_clicks:
              type: integer
              description: Clicks on queries containing a branded search term.
            non_brand_clicks:
              type: integer
              description: Clicks on listed queries without a branded term. Unlisted searches are never non-brand.
            unlisted_clicks:
              type: integer
              description: Clicks the provider counts for the site but on no search it lists. Google hides rare searches; Bing lists only its top searches each week.
            days_with_data:
              type: integer
    SearchSummary:
      type: object
      required: [provider, site, current, previous]
      properties:
        provider:
          type: string
        site:
          type: string
          description: Empty until something is synced.
        current:
          oneOf:
            - $ref: "#/components/schemas/SearchPeriod"
            - type: "null"
          description: The latest 28 days, ending on the latest final day.
        previous:
          oneOf:
            - $ref: "#/components/schemas/SearchPeriod"
            - type: "null"
          description: The window before current. Null without data there.
    SearchDay:
      allOf:
        - $ref: "#/components/schemas/SearchTotals"
        - type: object
          required: [date, final]
          properties:
            date:
              type: string
              format: date
            final:
              type: boolean
              description: False while the provider still revises the day.
    SearchDaily:
      type: object
      required: [provider, site, latest_final_day, days]
      properties:
        provider:
          type: string
        site:
          type: string
        latest_final_day:
          type: string
          description: The latest day the provider has finalized.
        days:
          type: array
          description: Days the provider reported, oldest first. A day with no entry had no impressions.
          items:
            $ref: "#/components/schemas/SearchDay"
    SearchBrandPoint:
      type: object
      required: [date, clicks, brand_clicks, non_brand_clicks, unlisted_clicks]
      properties:
        date:
          type: string
          format: date
          description: The last day of the 28-day window.
        clicks:
          type: integer
        brand_clicks:
          type: integer
        non_brand_clicks:
          type: integer
        unlisted_clicks:
          type: integer
    SearchBrand:
      type: object
      required: [provider, site, terms, points]
      properties:
        provider:
          type: string
        site:
          type: string
        terms:
          type: array
          items:
            type: string
          description: The branded search terms in use.
        points:
          type: array
          items:
            $ref: "#/components/schemas/SearchBrandPoint"
    SearchPages:
      type: object
      required: [provider, site, from, to, pages]
      properties:
        provider:
          type: string
        site:
          type: string
        from:
          type: string
        to:
          type: string
        pages:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/SearchTotals"
              - type: object
                required: [page]
                properties:
                  page:
                    type: string
    SearchQueries:
      type: object
      required: [provider, site, from, to, non_brand, queries]
      properties:
        provider:
          type: string
        site:
          type: string
        from:
          type: string
        to:
          type: string
        non_brand:
          type: boolean
        queries:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/SearchTotals"
              - type: object
                required: [query, branded]
                properties:
                  query:
                    type: string
                  branded:
                    type: boolean
    GoalInput:
      type: object
      required: [provider, metric, window_days, target, due_on]
      additionalProperties: false
      properties:
        provider:
          type: string
          description: The search engine the goal counts, one GET /v1/search/providers lists, such as google or bing.
        metric:
          type: string
          enum: [clicks, impressions, non_brand_clicks]
        window_days:
          type: integer
          enum: [28, 90]
          description: The trailing window the metric is summed over, rounded to whole weeks for Bing, so 90 counts 91.
        target:
          type: integer
          minimum: 1
        due_on:
          type: string
          format: date
    Goal:
      allOf:
        - $ref: "#/components/schemas/GoalInput"
        - type: object
          required: [id, progress]
          properties:
            id:
              type: integer
            progress:
              description: The metric over the window ending on the provider's latest final day. Null until its data is synced.
              oneOf:
                - type: "null"
                - type: object
                  required: [from, to, value, fraction, reached, days_with_data]
                  properties:
                    from:
                      type: string
                      format: date
                    to:
                      type: string
                      format: date
                    value:
                      type: integer
                    fraction:
                      type: number
                      description: Value over target, 1 or more once reached.
                    reached:
                      type: boolean
                    days_with_data:
                      type: integer
                      description: Less than the window while history is short.
    SearchStatus:
      type: object
      description: One search engine as anyone with results:read sees it, its connection and the data stored. Never the credential.
      required: [provider, title, product, methods, step_days, site_position, backfill_months, notes, connected, method, account, site, site_kind, backfill, connected_at, last_sync_at, last_sync_error, syncing, data_site, first_day, latest_final_day, partial_days]
      properties:
        provider:
          type: string
          description: Its name in paths and goals, such as google or bing.
        title:
          type: string
          description: The search engine, such as Google or Bing.
        product:
          type: string
          description: Its webmaster tools, such as Search Console or Bing Webmaster Tools.
        methods:
          type: array
          description: The ways to connect it, in the order to offer them.
          items:
            type: object
            required: [method, label, available]
            properties:
              method:
                type: string
                enum: [oauth, service_account, api_key]
              label:
                type: string
              available:
                type: boolean
                description: False for Google sign-in on an instance without GSC_GOOGLE_CLIENT_ID.
              steps:
                type: array
                items:
                  type: string
                description: For a pasted key, how to get one.
        step_days:
          type: integer
          description: The days one stored row of searches or pages covers, 1 for Google and 7 for Bing's weeks. Every window is a whole number of them.
        site_position:
          type: boolean
          description: Whether it reports the whole site's average position. Bing does not.
        backfill_months:
          type: integer
          description: How far back a first sync reaches with backfill on. 0 when every sync reads all the provider keeps.
        notes:
          type: array
          items:
            type: string
          description: How its numbers differ from a plain daily count, in plain words.
        connected:
          type: boolean
        method:
          type: string
          enum: ["", oauth, service_account, api_key]
        account:
          type: string
          description: The service account's email. Empty for a Google sign-in and for Bing.
        site:
          type: string
          description: The site synced. Empty until one is picked.
        site_kind:
          type: string
          enum: ["", domain, url_prefix]
          description: Google's property type. Empty for Bing.
        backfill:
          type: boolean
        connected_at:
          type: [string, "null"]
          format: date-time
        last_sync_at:
          type: [string, "null"]
          format: date-time
          description: When the last sync finished. Null before the first, and after another site is picked.
        last_sync_error:
          type: string
          description: Why the last sync failed. Empty when it did not.
        syncing:
          type: boolean
        data_site:
          type: string
          description: The site the stored numbers are for, which the Search page shows. Empty when nothing is stored.
        first_day:
          type: string
        latest_final_day:
          type: string
          description: The latest final day, which every window ends on; for Bing, the end of its latest final week.
        partial_days:
          type: array
          items:
            type: string
          description: Stored days the provider still revises. The next sync overwrites them.
    SearchSite:
      type: object
      required: [url, kind, permission, suggested]
      properties:
        url:
          type: string
          description: The site as the provider names it.
        kind:
          type: string
          enum: ["", domain, url_prefix]
          description: Google's property type. Empty for Bing.
        permission:
          type: string
          description: Google's permission level, such as siteOwner. Empty for Bing.
        suggested:
          type: boolean
          description: The site matching your primary domain.
    GapPair:
      description: One pair's answers to a gap's question. Asked several times, it says what most of the answers say.
      allOf:
        - $ref: "#/components/schemas/Series"
        - type: object
          required: [answer_id, answer_ids, status, named, position, answered, named_answers, fan_out, links]
          properties:
            answer_id:
              type: integer
              description: The first sample's answer.
            answer_ids:
              type: array
              items:
                type: integer
              description: Every sample's answer, in sample order.
            status:
              type: string
              enum: [ok, no_answer, failed]
              description: Failed only when every answer failed.
            named:
              type: boolean
              description: Most answers named you.
            position:
              type: [integer, "null"]
              description: Your best position among the answers that named you.
            answered:
              type: integer
              description: Answers that did not fail.
            named_answers:
              type: integer
              description: Answers that named you.
            fan_out:
              type: array
              items:
                type: string
              description: The web searches the engine ran for the question, in order; a later answer adds only those earlier ones did not. Empty where the endpoint does not expose them.
            links:
              type: array
              items:
                type: string
              description: The pages the answers linked to, in order, without your own site's; a later answer adds only those earlier ones did not.
    BriefLine:
      description: One pair's answers to the brief's question. A check that asks a question several times gives it several answers, and the line says what most of them did.
      allOf:
        - $ref: "#/components/schemas/Series"
        - type: object
          required: [title, answer_id, answer_ids, answered, named, linked, state, position, brands, fan_out, links]
          properties:
            title:
              type: string
              description: The surface, and the model where it takes one, such as "Claude Code · claude-sonnet-4-5".
            answer_id:
              type: integer
              description: The first of answer_ids.
            answer_ids:
              type: array
              items:
                type: integer
              description: Every answer the line sums up, in the order asked.
            answered:
              type: integer
              description: Answers that did not fail.
            named:
              type: integer
              description: Answers that named you.
            linked:
              type: integer
              description: Answers that linked to your site.
            state:
              type: string
              enum: [named_linked, named, linked, missed]
              description: What most answers did. linked means they linked to your site without naming you.
            position:
              type: [integer, "null"]
              description: Your best position among the answers that named you. Null unless most did.
            brands:
              type: array
              items:
                type: string
              description: Your brand and competitors most answers named, in the order first named.
            fan_out:
              type: array
              items:
                type: string
              description: The web searches the engine ran, in order and without repeats. Empty where the endpoint does not expose them.
            links:
              type: array
              items:
                type: string
              description: The pages the answers linked to, in order and without repeats.
    BriefPage:
      type: object
      required: [url, domain, is_self, answers, check, outreach]
      properties:
        url:
          type: string
        domain:
          type: string
        is_self:
          type: boolean
        answers:
          type: integer
          description: Answers that linked to it.
        check:
          oneOf:
            - $ref: "#/components/schemas/PageCheck"
            - type: "null"
          description: Null until the page has been fetched.
        outreach:
          type: boolean
          description: A page that names a competitor and not you, on a site neither yours nor a competitor's.
    Brief:
      type: object
      required: [run_id, question, answered, named, linked, instead, fan_out, lines, pages, prompt]
      properties:
        run_id:
          type: integer
        question:
          $ref: "#/components/schemas/QuestionRef"
        answered:
          type: integer
          description: Answers that did not fail.
        named:
          type: integer
          description: Answers that named you.
        linked:
          type: integer
          description: Answers that linked to your site.
        instead:
          type: array
          items:
            type: string
          description: Competitors named by the answers that did not name you, most often first.
        fan_out:
          type: array
          items:
            type: string
          description: Every web search the pairs ran, those of answers that left you out first.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/BriefLine"
          description: One per pair that answered, missed first, then linked, named, and named and linked, each in pair order.
        pages:
          type: array
          items:
            $ref: "#/components/schemas/BriefPage"
          description: The 10 pages the most answers linked to.
        prompt:
          type: string
          description: Markdown to paste into an agent working on your site.
    RunRef:
      type: object
      required: [id, started_at]
      properties:
        id:
          type: integer
        started_at:
          type: string
          format: date-time
    Dot:
      type: object
      description: One question in one run over the pairs in scope.
      required: [run_id, state, named, answered]
      properties:
        run_id:
          type: integer
        state:
          type: string
          enum: [named, cited, not_named, failed]
          description: named when most answers named you on some pair, cited when on none but most cited your domains on one, not_named when some pair answered without either, failed when every call failed.
        named:
          type: integer
          description: Pairs most answers named you on.
        answered:
          type: integer
          description: Pairs whose calls did not all fail.
    PromptRow:
      type: object
      required: [question, answered, named_by, best_position, instead, dots]
      properties:
        question:
          $ref: "#/components/schemas/QuestionRef"
        answered:
          type: integer
          description: Pairs that answered on the latest run.
        named_by:
          type: array
          items:
            $ref: "#/components/schemas/Series"
          description: The pairs most answers named you on in the latest run.
        best_position:
          type: [integer, "null"]
        instead:
          type: array
          items:
            type: string
          description: Competitors named on the latest run by answers that did not name you, most often first.
        dots:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/Dot"
              - type: "null"
          description: One per run in Prompts.runs, null where the question was not asked.
    Prompts:
      type: object
      required: [runs, latest_run_id, rows]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunRef"
          description: Runs in range with answers on the pairs in scope, oldest first.
        latest_run_id:
          type: integer
          description: 0 when no run in range has answers.
        rows:
          type: array
          items:
            $ref: "#/components/schemas/PromptRow"
          description: In question order.
    PageCheck:
      type: object
      description: What Byname found on a cited page the last time it read it.
      required: [status, fetched_at, self_present, brands, competitors, error]
      properties:
        status:
          type: string
          enum: [ok, failed, disallowed, refused]
          description: disallowed means robots.txt said no; refused means not http(s), or a private or loopback address.
        fetched_at:
          type: string
          format: date-time
        self_present:
          type: [boolean, "null"]
          description: Whether the page's HTML names you. Null unless status is ok.
        brands:
          type: array
          items:
            type: string
        competitors:
          type: array
          items:
            type: string
        error:
          type: string
    SourcePage:
      type: object
      required: [url, domain, is_self, citations, answers, check, outreach]
      properties:
        url:
          type: string
        domain:
          type: string
        is_self:
          type: boolean
        citations:
          type: integer
        answers:
          type: integer
        check:
          oneOf:
            - $ref: "#/components/schemas/PageCheck"
            - type: "null"
          description: Null until the page has been fetched.
        outreach:
          type: boolean
          description: A page that names a competitor and not you, on a site neither yours nor a competitor's.
    SourceDomain:
      type: object
      required: [domain, is_self, citations, answers, pages, outreach]
      properties:
        domain:
          type: string
        is_self:
          type: boolean
        citations:
          type: integer
        answers:
          type: integer
        pages:
          type: integer
        outreach:
          type: integer
          description: Pages flagged as outreach targets.
    Sources:
      type: object
      required: [answered, citing, citations, domain_count, page_count, domains, pages]
      properties:
        answered:
          type: integer
        citing:
          type: integer
          description: Answers that cited at least one page.
        citations:
          type: integer
        domain_count:
          type: integer
        page_count:
          type: integer
        domains:
          type: array
          items:
            $ref: "#/components/schemas/SourceDomain"
          description: The 50 most cited.
        pages:
          type: array
          items:
            $ref: "#/components/schemas/SourcePage"
          description: The 100 most cited.
    EnginePrompt:
      type: object
      required: [question, answer_id, position, cited, instead]
      properties:
        question:
          $ref: "#/components/schemas/QuestionRef"
        answer_id:
          type: integer
          description: The answer to open, the best placed one when the line combines models or asks more than once.
        position:
          type: [integer, "null"]
          description: Your best position among the pairs most answers named you on. Null when there are none.
        cited:
          type: boolean
          description: Most answers cited your domains on a pair of the line.
        instead:
          type: array
          items:
            type: string
    Engine:
      description: One line's standing on its latest run in range, its visibility per run, and the brands it names.
      allOf:
        - $ref: "#/components/schemas/Series"
        - type: object
          required: [models, runs, latest_run_id, answered, named, visibility, prompts, visible_prompts, average_position, points, ranking, not_mentioned, visible]
          properties:
            models:
              type: array
              items:
                type: string
            runs:
              type: integer
            latest_run_id:
              type: integer
            answered:
              type: integer
            named:
              type: integer
            visibility:
              type: [number, "null"]
              description: Named over answered on the latest run.
            prompts:
              type: integer
            visible_prompts:
              type: integer
              description: Questions most answers named you on, on a pair of the line.
            average_position:
              type: [number, "null"]
            points:
              type: array
              items:
                $ref: "#/components/schemas/RatePoint"
            ranking:
              type: array
              items:
                $ref: "#/components/schemas/BrandStanding"
            not_mentioned:
              type: array
              items:
                $ref: "#/components/schemas/EnginePrompt"
            visible:
              type: array
              items:
                $ref: "#/components/schemas/EnginePrompt"
    ChangeOutcome:
      type: string
      enum: [improved, worsened, no_change, insufficient_data]
    ChangeWindow:
      type: object
      description: One side of a read. The page's and the control set's numbers over the same final days.
      required: [from, to, days, page, control]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: integer
        page:
          $ref: "#/components/schemas/SearchTotals"
        control:
          $ref: "#/components/schemas/SearchTotals"
    ChangeRead:
      type: object
      description: >-
        One difference-in-differences read. The after window runs from the day
        after the first crawl for the read's length (interim or verdict days),
        cut at the latest final day; the before window is as many days ending
        the day before the merge. Each delta is the page's change minus the
        control set's.
      required: [kind, read_on, outcome, reason, before, after, deltas, signals, controls, thresholds]
      properties:
        kind:
          type: string
          enum: [interim, final]
        read_on:
          type: string
          format: date
        outcome:
          $ref: "#/components/schemas/ChangeOutcome"
        reason:
          type: string
          description: Why the data was insufficient; empty otherwise.
        before:
          $ref: "#/components/schemas/ChangeWindow"
        after:
          $ref: "#/components/schemas/ChangeWindow"
        deltas:
          oneOf:
            - type: "null"
            - type: object
              required: [position, ctr_points, impressions_ratio]
              properties:
                position:
                  type: number
                  description: In places; negative means the page moved up.
                ctr_points:
                  type: number
                  description: In percentage points.
                impressions_ratio:
                  type: number
                  description: Above 1 means the page gained on the controls.
        signals:
          type: array
          items:
            type: object
            required: [metric, way]
            properties:
              metric:
                type: string
                enum: [position, ctr, impressions]
              way:
                type: string
                enum: [improved, worsened]
        controls:
          type: array
          items:
            type: string
        thresholds:
          $ref: "#/components/schemas/ChangeThresholds"
    ChangeThresholds:
      type: object
      required: [position, ctr_points, impressions_ratio]
      properties:
        position:
          type: number
          default: 2.5
        ctr_points:
          type: number
          default: 0.8
        impressions_ratio:
          type: number
          default: 2.7
    ChangeSettings:
      type: object
      required: [interim_days, verdict_days, position, ctr_points, impressions_ratio]
      additionalProperties: false
      properties:
        interim_days:
          type: integer
          minimum: 7
          maximum: 90
          default: 17
        verdict_days:
          type: integer
          minimum: 14
          maximum: 180
          default: 31
          description: More than interim_days.
        position:
          type: number
          default: 2.5
          description: Places of average position against the controls.
        ctr_points:
          type: number
          default: 0.8
          description: Percentage points of CTR against the controls.
        impressions_ratio:
          type: number
          default: 2.7
          description: Impressions ratio against the controls; its inverse counts as worse.
    Change:
      type: object
      required: [id, url, kind, source, repo, pr_number, pr_title, pr_url, merged_at, notes, stage, first_crawl_at, interim_on, verdict_on, before, interim, final, verdict]
      properties:
        id:
          type: integer
        url:
          type: string
        kind:
          type: string
          enum: [new_page, edit, removed]
        source:
          type: string
          enum: [github, manual]
        repo:
          type: string
          description: owner/name; empty for a manual change.
        pr_number:
          type: integer
          description: 0 for a manual change.
        pr_title:
          type: string
        pr_url:
          type: string
        merged_at:
          type: string
          format: date-time
        notes:
          type: string
        stage:
          type: string
          enum: [awaiting_crawl, awaiting_interim, awaiting_verdict, decided]
        first_crawl_at:
          type: [string, "null"]
          format: date-time
          description: Google's first crawl seen after the merge.
        interim_on:
          type: [string, "null"]
          format: date
          description: The interim read's day in the instance's time zone.
        verdict_on:
          type: [string, "null"]
          format: date
          description: The final read's day in the instance's time zone.
        before:
          description: The page's numbers over the verdict-length window that ends the day before the merge. Null until those days are final.
          oneOf:
            - type: "null"
            - allOf:
                - $ref: "#/components/schemas/SearchTotals"
                - type: object
                  required: [from, to]
                  properties:
                    from:
                      type: string
                      format: date
                    to:
                      type: string
                      format: date
        interim:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ChangeRead"
        final:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ChangeRead"
        verdict:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ChangeOutcome"
    ChangeDetail:
      allOf:
        - $ref: "#/components/schemas/Change"
        - type: object
          required: [timeline, inspections]
          properties:
            timeline:
              type: array
              items:
                type: object
                required: [kind, at, done, detail]
                properties:
                  kind:
                    type: string
                    enum: [merged, inspected, crawled, interim, verdict]
                  at:
                    type: string
                    description: A date-time, or for interim and verdict a date.
                  done:
                    type: boolean
                  detail:
                    type: string
            inspections:
              type: array
              items:
                type: object
                required: [checked_at, verdict, coverage_state, last_crawl_at, error]
                properties:
                  checked_at:
                    type: string
                    format: date-time
                  verdict:
                    type: string
                  coverage_state:
                    type: string
                  last_crawl_at:
                    type: [string, "null"]
                    format: date-time
                  error:
                    type: string
    ManualChange:
      type: object
      required: [url, kind, merged_at]
      additionalProperties: false
      properties:
        url:
          type: string
          description: The page's full URL, as Search Console reports it.
        kind:
          type: string
          enum: [new_page, edit, removed]
        merged_at:
          type: string
          description: When it went live, a date-time or a date (midnight in the instance's time zone).
        notes:
          type: string
    ChangeMarker:
      type: object
      required: [date, label, change_ids]
      properties:
        date:
          type: string
          format: date
        label:
          type: string
        change_ids:
          type: array
          items:
            type: integer
    ControlPage:
      type: object
      required: [id, url, hold_until, note, active]
      properties:
        id:
          type: integer
        url:
          type: string
        hold_until:
          type: string
          format: date
        note:
          type: string
        active:
          type: boolean
          description: False once hold_until has passed, when the page drops out of the control set.
    PathRule:
      type: object
      required: [glob, url]
      additionalProperties: false
      properties:
        glob:
          type: string
          description: A repo path pattern such as content/blog/*.mdx or app/**/page.tsx.
        url:
          type: string
          description: The page URL, with {1}, {2} for what each wildcard matched.
    RepoStatus:
      type: object
      description: The repo connection as anyone with results:read sees it. Never the token.
      required: [connected, provider, repo, default_branch, token_expires_at, expiring_soon, rules, connected_at, last_poll_at, last_poll_error]
      properties:
        connected:
          type: boolean
          description: A token is stored.
        provider:
          type: string
          description: github, empty before a repo was ever connected.
        repo:
          type: string
        default_branch:
          type: string
        token_expires_at:
          type: [string, "null"]
          format: date-time
        expiring_soon:
          type: boolean
          description: The token expires within 14 days.
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PathRule"
        connected_at:
          type: [string, "null"]
          format: date-time
        last_poll_at:
          type: [string, "null"]
          format: date-time
        last_poll_error:
          type: string
    SocialNetwork:
      type: string
      enum: [x, reddit, hackernews, linkedin, youtube, threads, bluesky]
    Engagement:
      type: object
      description: What the network reports about a post. A count it does not give is null, never 0.
      required: [likes, replies, reposts, score, views, total]
      properties:
        likes:
          type: [integer, "null"]
        replies:
          type: [integer, "null"]
        reposts:
          type: [integer, "null"]
        score:
          type: [integer, "null"]
          description: Points on Hacker News, score on Reddit.
        views:
          type: [integer, "null"]
          description: Views on X and YouTube.
        total:
          type: integer
          description: What ranks posts within a network, views on YouTube, elsewhere likes, replies, reposts and score added up.
    SocialCall:
      type: object
      description: The search call that first found a post.
      required: [id, route, treg_call_id, cost_usd, cost_missing]
      properties:
        id:
          type: integer
        route:
          type: string
          enum: [treg, direct]
        treg_call_id:
          type: string
        cost_usd:
          type: [number, "null"]
          description: The whole call's cost, shared by every post it found. Null when Treg reported no cost; 0 for a direct call, which is free.
        cost_missing:
          type: boolean
    SocialMention:
      type: object
      required: [id, network, post_id, url, author_handle, author_name, text, posted_at, posted_approx, engagement, term, first_seen_at, subreddit, hidden, left_out_as, filtered_by, call]
      properties:
        id:
          type: integer
        network:
          $ref: "#/components/schemas/SocialNetwork"
        post_id:
          type: string
        url:
          type: string
        author_handle:
          type: string
          description: Lowercase, with no @ or u/. A YouTube channel's name without spaces.
        author_name:
          type: string
        text:
          type: string
        posted_at:
          type: string
          format: date-time
        posted_approx:
          type: boolean
          description: True when the network gave only an age, as YouTube does.
        engagement:
          $ref: "#/components/schemas/Engagement"
        term:
          type: string
        first_seen_at:
          type: string
          format: date-time
        subreddit:
          type: string
          description: The subreddit a Reddit post is in, lowercase, without r/. Empty on other networks.
        hidden:
          type: boolean
          description: Its author is on the left-out list, or a topic or subreddit filter hides it.
        left_out_as:
          type: string
          description: The label that hides its author, empty when the author is not left out.
        filtered_by:
          type: string
          description: Why a filter hides it, such as "topic weather", "r/weather", "not in your subreddits" or "none of your topics". Empty when no filter does.
        call:
          oneOf:
            - $ref: "#/components/schemas/SocialCall"
            - type: "null"
    SocialMentionList:
      type: object
      required: [mentions, total, hidden]
      properties:
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/SocialMention"
        total:
          type: integer
          description: Mentions that match and are shown, which can be more than returned.
        hidden:
          type: integer
          description: Mentions that match but are by left-out accounts or hidden by a filter.
    SocialDigest:
      type: object
      required: [cadence, from, to, starts_at, ends_at, finished, mentions, hidden, networks, new_authors, calls, spend_usd, spend_missing_calls]
      properties:
        cadence:
          type: string
          enum: [daily, weekly]
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        finished:
          type: boolean
        mentions:
          type: integer
        hidden:
          type: integer
        networks:
          type: array
          description: Each network with a mention, most mentions first.
          items:
            type: object
            required: [network, title, mentions, top]
            properties:
              network:
                $ref: "#/components/schemas/SocialNetwork"
              title:
                type: string
              mentions:
                type: integer
              top:
                type: array
                maxItems: 5
                items:
                  $ref: "#/components/schemas/SocialMention"
        new_authors:
          type: array
          description: Accounts whose first shown mention fell in the period.
          items:
            type: object
            required: [network, handle, name, profile, mentions]
            properties:
              network:
                $ref: "#/components/schemas/SocialNetwork"
              handle:
                type: string
              name:
                type: string
              profile:
                type: string
              mentions:
                type: integer
        calls:
          type: integer
        spend_usd:
          type: number
        spend_missing_calls:
          type: integer
          description: Treg calls that reported no cost, left out of spend_usd rather than counted as $0.00.
    SocialSettings:
      type: object
      required: [enabled, terms, default_terms, custom_terms, fetch_every_hours, digest_cadence, digest_weekday, time_zone, token_set, networks, last_fetch_at, next_fetch_at]
      properties:
        enabled:
          type: boolean
          description: Whether social searches run. Off until someone turns them on, because the Treg networks cost money. Nothing is searched before onboarding is finished either way.
        terms:
          type: array
          items:
            type: string
        default_terms:
          type: array
          description: Your brand's name and primary domain, searched when no terms are set.
          items:
            type: string
        custom_terms:
          type: boolean
        fetch_every_hours:
          type: integer
          enum: [1, 3, 6, 12, 24]
        digest_cadence:
          type: string
          enum: [daily, weekly]
        digest_weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: The day a weekly digest's week starts, 0 for Sunday.
        time_zone:
          type: string
        token_set:
          type: boolean
          description: Whether a Treg token is stored. Without one only Bluesky is searched.
        networks:
          type: array
          items:
            type: object
            required: [network, title, enabled, route, tool, cost_per_call_usd, last_call_at, last_error, unavailable]
            properties:
              network:
                $ref: "#/components/schemas/SocialNetwork"
              title:
                type: string
              enabled:
                type: boolean
              route:
                type: string
                enum: [treg, direct]
              tool:
                type: string
              cost_per_call_usd:
                type: number
              last_call_at:
                type: [string, "null"]
                format: date-time
              last_error:
                type: string
              unavailable:
                type: boolean
                description: The latest call found the network's public search asking for sign-in.
        last_fetch_at:
          type: [string, "null"]
          format: date-time
        next_fetch_at:
          type: [string, "null"]
          format: date-time
          description: Null while nothing will be searched. Social is off, onboarding is not finished, there is no term, or no network that is on can run without the missing Treg token.
    SocialSettingsInput:
      type: object
      required: [terms, fetch_every_hours, digest_cadence, digest_weekday]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: True to search, false to stop. Leave it out to keep the current setting.
        terms:
          type: array
          maxItems: 5
          description: 1 to 5 terms, or [] to search for your brand's name and primary domain.
          items:
            type: string
        fetch_every_hours:
          type: integer
          enum: [1, 3, 6, 12, 24]
        digest_cadence:
          type: string
          enum: [daily, weekly]
        digest_weekday:
          type: integer
          minimum: 0
          maximum: 6
        networks:
          type: array
          description: Networks to turn on or off; one left out keeps its setting.
          items:
            type: object
            required: [network, enabled]
            additionalProperties: false
            properties:
              network:
                $ref: "#/components/schemas/SocialNetwork"
              enabled:
                type: boolean
    OtherBrands:
      type: object
      required: [answered, read, latest_run, previous_run, hidden, min_questions, brands]
      properties:
        answered:
          type: integer
          description: Answers in range that did not fail, the N in "named in M of N answers".
        min_questions:
          type: integer
          description: A brand is listed once answers to at least this many different questions offered it as a choice, not just named it.
        read:
          type: integer
          description: Of those, answers read for other brands. An unread answer names none here yet.
        latest_run:
          type: integer
          description: The newest check in range, 0 when none.
        previous_run:
          type: integer
          description: The check before latest_run on these AI apps, 0 when latest_run is the first.
        hidden:
          type: integer
          description: Brands marked as not a competitor.
        brands:
          type: array
          items:
            type: object
            required: [brand_id, name, domain, named, latest, previous, change, questions]
            properties:
              brand_id:
                type: integer
              name:
                type: string
              domain:
                type: string
              named:
                type: integer
                description: Answers in range that named it.
              latest:
                type: integer
              previous:
                type: integer
              change:
                type: [integer, "null"]
                description: latest minus previous, null when the latest check is the first.
              questions:
                type: array
                description: The questions whose answers named it most, at most 3.
                items:
                  type: object
                  required: [question_id, text, named]
                  properties:
                    question_id:
                      type: integer
                    text:
                      type: string
                    named:
                      type: integer
    HiddenBrand:
      type: object
      required: [brand_id, name, domain, named]
      properties:
        brand_id:
          type: integer
        name:
          type: string
        domain:
          type: string
        named:
          type: integer
          description: Answers that named it, over all time.
    OtherBrandsSettings:
      type: object
      required: [has_token, onboarded, find, logos]
      properties:
        has_token:
          type: boolean
          description: A Treg token is stored. Both need one.
        onboarded:
          type: boolean
        find:
          type: object
          required: [on, cost_per_answer_usd, model, min_questions]
          properties:
            on:
              type: boolean
            cost_per_answer_usd:
              type: number
              description: The mean of past reads, or the sampled price before any.
            model:
              type: string
            min_questions:
              type: integer
              description: A brand is listed once answers to at least this many different questions offered it as a choice.
        logos:
          type: object
          required: [on, cost_per_brand_usd, month_limit, month_max_usd, this_month, logos]
          properties:
            on:
              type: boolean
            cost_per_brand_usd:
              type: number
              description: The mean of past lookups, or Context.dev's price before any. A brand Context.dev has nothing for costs nothing.
            month_limit:
              type: integer
            month_max_usd:
              type: number
              description: month_limit times cost_per_brand_usd.
            this_month:
              type: integer
            logos:
              type: integer
              description: Brands with a logo.
    OtherBrandsSettingsInput:
      type: object
      additionalProperties: false
      properties:
        find:
          type: boolean
        logos:
          type: boolean
        logo_month_limit:
          type: integer
          minimum: 0
          maximum: 1000
        min_questions:
          type: integer
          minimum: 1
          maximum: 50
    BrandBackfill:
      type: object
      required: [unread, cost_per_answer_usd, cost_usd, ready, latest]
      properties:
        unread:
          type: integer
          description: Answers of finished checks never read for other brands.
        cost_per_answer_usd:
          type: number
        cost_usd:
          type: number
          description: unread times cost_per_answer_usd.
        ready:
          type: boolean
          description: Reading is on, a Treg token is stored and onboarding is finished, so a pass can start.
        latest:
          oneOf:
            - type: "null"
            - type: object
              required: [job_id, status, started_at, finished_at, read, spent_usd, error]
              properties:
                job_id:
                  type: integer
                status:
                  type: string
                  enum: [queued, running, completed, capped, refused, failed]
                started_at:
                  type: string
                  format: date-time
                finished_at:
                  type: [string, "null"]
                  format: date-time
                read:
                  type: integer
                spent_usd:
                  type: number
                error:
                  type: string
    Logo:
      type: object
      required: [brand_id, domain, color, version]
      properties:
        brand_id:
          type: integer
        domain:
          type: string
        color:
          type: string
          description: The brand's main colour as #rrggbb, or empty.
        version:
          type: integer
          description: Changes when the logo does. Add it to the logo URL as ?v= to cache it.
    LeftOut:
      type: object
      required: [id, network, handle, label, profile, mentions]
      properties:
        id:
          type: integer
        network:
          $ref: "#/components/schemas/SocialNetwork"
        handle:
          type: string
        label:
          type: string
          description: Who it is, such as a person's name or Our accounts.
        profile:
          type: string
        mentions:
          type: integer
          description: Stored mentions it hides.
    SocialFilter:
      type: object
      required: [id, kind, mode, value, mentions]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [topic, subreddit]
        mode:
          type: string
          enum: [leave_out, only]
          description: leave_out hides the posts it matches. only hides the posts of its kind that match no only filter of that kind.
        value:
          type: string
          description: The topic, lowercase, or the subreddit's name without r/.
        mentions:
          type: integer
          description: Stored mentions it matches.
    SocialFilterInput:
      type: object
      required: [kind, mode, value]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [topic, subreddit]
        mode:
          type: string
          enum: [leave_out, only]
        value:
          type: string
          description: A topic is a word or phrase, matched as a whole word in any case. A subreddit is its name, r/name or a link to it.
    LeftOutInput:
      type: object
      required: [network, handle, label]
      additionalProperties: false
      properties:
        network:
          $ref: "#/components/schemas/SocialNetwork"
        handle:
          type: string
          description: The handle (@name, u/name, name), a YouTube channel's name, or a link to the profile.
        label:
          type: string
          maxLength: 80
