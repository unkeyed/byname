              schema:
                $ref: "#/components/schemas/ConsentRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [settings]
      operationId: decideConsentRequest
      summary: Approve or decline the request as the signed-in person, choosing the scopes the app gets. Approving needs a recent sign-in. Each request is answered once.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              additionalProperties: false
              properties:
                approve:
                  type: boolean
                scopes:
                  type: array
                  items:
                    $ref: "#/components/schemas/Scope"
                  description: What the app may do, from the request's scopes and only ones your role has. Approving needs at least one.
      responses:
        "200":
          description: Where to send the browser, the app's redirect_uri with a code and state, or with error=access_denied.
          content:
            application/json:
              schema:
                type: object
                required: [redirect]
                properties:
                  redirect:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Reauth"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/users:
    get:
      tags: [settings]
      operationId: listUsers
      summary: Everyone who can sign into the UI, oldest first.
      security:
        - session: [admin]
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    patch:
      tags: [settings]
      operationId: setUserRole
      summary: Change a teammate's role. Their keys and connected apps keep only the scopes the new role has, from their next request. The last admin cannot step down.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Reauth"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [settings]
      operationId: removeUser
      summary: Remove a teammate with their sessions, passkeys, linked logins, connected apps and API keys. The last admin cannot be removed.
      security:
        - session: [admin]
      responses:
        "204":
          description: Removed. Their sessions ended.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Reauth"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/invites:
    post:
      tags: [settings]
      operationId: createInvite
      summary: Create a one-time invite for a teammate with a role, valid for 7 days. Send them /invite/{token}.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "201":
          description: The invite token.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Reauth"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/credentials:
    get:
      tags: [settings]
      operationId: listCredentials
      summary: Each credential Byname stores, whether it is set and how its last test went.
      description: No response ever carries a credential's secret.
      security:
        - session: [admin]
      responses:
        "200":
          description: Credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/credentials/{kind}:
    parameters:
      - $ref: "#/components/parameters/credentialKind"
    put:
      tags: [settings]
      operationId: setCredential
      summary: Store a key, sealed with ENCRYPTION_KEY, replacing any key of that kind stored before.
      description: Needs a recent sign-in. Replacing a key clears its last test. The response never carries the key.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              additionalProperties: false
              properties:
                secret:
                  type: string
                  maxLength: 1024
                  description: The key as the provider shows it, with no spaces. DataForSEO takes login:password.
                org:
                  type: string
                  description: Treg's X-Treg-Org. Only a personal Treg token needs it.
      responses:
        "200":
          description: The credential, without its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Reauth"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [settings]
      operationId: deleteCredential
      summary: Remove a key no surface uses.
      description: Needs a recent sign-in. 409 while a surface's route still calls with it.
      security:
        - session: [admin]
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Reauth"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/credentials/{kind}/test:
    parameters:
      - $ref: "#/components/parameters/credentialKind"
    post:
      tags: [settings]
      operationId: testCredential
      summary: Test a stored key with one free call, where the provider has one, and record how it went.
      description: A failed test is a result, not an error, and last_test_status says why. Providers with no free call record that instead. 400 when no key of that kind is set.
      security:
        - session: [admin]
      responses:
        "200":
          description: The credential with this test's outcome, without its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/notification-channels:
    get:
      tags: [settings]
      operationId: listChannels
      summary: Every notification channel, and every event kind a channel can subscribe to.
      description: No response ever carries a channel's secrets.
      security:
        - session: [admin]
      responses:
        "200":
          description: Channels and event kinds.
          content:
            application/json:
              schema:
                type: object
                required: [channels, events]
                properties:
                  channels:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationChannel"
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventKind"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [settings]
      operationId: createChannel
      summary: Add a notification channel, its secrets sealed with ENCRYPTION_KEY.
      description: Needs a recent sign-in. A webhook channel's signing secret is made here and returned this once, as signing_secret.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "201":
          description: The channel, without its secrets, plus a webhook's signing secret.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/NotificationChannel"
                  - type: object
                    properties:
                      signing_secret:
                        type: string
                        description: Only for a webhook channel, only in this response. Verify X-Byname-Signature with it.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Reauth"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/notification-channels/{id}:
    put:
      tags: [settings]
      operationId: updateChannel
      summary: Replace a channel's name, settings, events and enabled state.
      description: Needs a recent sign-in. secrets names only the secrets to change; the rest stay. The kind cannot change, and a webhook's signing secret cannot be set.
      security:
        - session: [admin]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "200":
          description: The channel, without its secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Reauth"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [settings]
      operationId: deleteChannel
      summary: Remove a channel and its delivery log.
      security:
        - session: [admin]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/notification-channels/{id}/test:
    post:
      tags: [settings]
      operationId: testChannel
      summary: Send a test message on the channel now and record how it went.
      description: A failed test is a result, not an error. last_test_status says why it failed.
      security:
        - session: [admin]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The channel with this test's outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/notification-deliveries:
    get:
      tags: [settings]
      operationId: listDeliveries
      summary: The delivery log, newest first. One row per notification and channel, with its attempts and last error.
