  /v1/runs:
    post:
      tags: [runs]
      operationId: runNow
      summary: Queue a check now without moving the schedule.
      description: >-
        Never starts a second run while one is queued or running. It returns
        that run instead, with 200, so pressing Run now twice is safe. Works
        while scheduled checks are paused. 400 until your brand, questions, an
        enabled surface and the Treg token are all set.
      security:
        - apiKey: [runs:write]
        - session: [runs:write]
      responses:
        "200":
          description: A run was already queued or running. This is that run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedRun"
        "201":
          description: The run this request queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      tags: [results]
      operationId: listRuns
      summary: Runs newest first, with what each spent and how each endpoint did.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      parameters:
        - $ref: "#/components/parameters/limit"
        - name: before
          in: query
          description: List only runs older than this run id. Send the last id of the previous page to page back.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/checks/pause:
    post:
      tags: [runs]
      operationId: pauseChecks
      summary: Pause scheduled checks.
      description: Run now still works while checks are paused.
      security:
        - apiKey: [runs:write]
        - session: [runs:write]
      responses:
        "200":
          description: The settings, with checks_paused true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/checks/resume:
    post:
      tags: [runs]
      operationId: resumeChecks
      summary: Resume scheduled checks without starting one.
      description: A check that fell due while paused moves to the next scheduled time, so resuming never starts a check by itself.
      security:
        - apiKey: [runs:write]
        - session: [runs:write]
      responses:
        "200":
          description: The settings, with checks_paused false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
