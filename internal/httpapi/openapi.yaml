      summary: Every search engine Byname reads, connected or not, with its sync state and the stored data's extent. Never a credential.
      description: The list is Byname's registry of providers, in the order to show them. Each says how to connect it, how many days one stored row of searches or pages covers (step_days, 7 for Bing's weekly top lists) and how its numbers differ, in plain words (notes).
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: The providers.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/search/{provider}/summary:
    parameters:
      - $ref: "#/components/parameters/searchProvider"
    get:
      tags: [search]
      operationId: getSearchSummary
      summary: One search engine's headline over the latest 28 days, and the 28 days before for the trend.
      description: Both windows end on the provider's latest final day and are a whole number of its step_days, so Bing's are 4 whole weeks; from and to say which days. Non-brand clicks never include unlisted searches. Engines are never added together.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: The numbers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/search/{provider}/daily:
    parameters:
      - $ref: "#/components/parameters/searchProvider"
    get:
      tags: [search]
      operationId: getSearchDaily
      summary: One search engine's site clicks, impressions, CTR and position per day, partial days marked.
      description: Every provider reports site totals by day. Bing gives no position for the whole site, so position is 0.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      parameters:
        - $ref: "#/components/parameters/searchFrom"
        - $ref: "#/components/parameters/searchTo"
      responses:
        "200":
          description: The numbers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchDaily"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/search/{provider}/brand:
    parameters:
      - $ref: "#/components/parameters/searchProvider"
    get:
      tags: [search]
      operationId: getSearchBrand
      summary: Brand against non-brand clicks over trailing 28-day windows, one window every step_days.
      description: Windows end on final days only, every day for Google and every week end for Bing. A query is brand when it contains a branded search term; unlisted clicks are never non-brand.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      parameters:
        - $ref: "#/components/parameters/searchFrom"
        - $ref: "#/components/parameters/searchTo"
      responses:
        "200":
          description: The numbers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchBrand"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/search/{provider}/pages:
    parameters:
      - $ref: "#/components/parameters/searchProvider"
    get:
      tags: [search]
      operationId: getSearchPages
      summary: One search engine's top pages by clicks over the window ending on the latest final day.
      description: For Bing these are sums of its weekly top lists, and the window rounds to whole weeks.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      parameters:
        - $ref: "#/components/parameters/searchDays"
        - $ref: "#/components/parameters/searchLimit"
      responses:
        "200":
          description: The numbers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPages"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/search/{provider}/queries:
    parameters:
      - $ref: "#/components/parameters/searchProvider"
    get:
      tags: [search]
      operationId: getSearchQueries
      summary: One search engine's top search queries by clicks over the window ending on the latest final day.
      description: Unlisted searches never appear. With non_brand=true, queries containing a branded search term are left out. For Bing these are sums of its weekly top lists, and the window rounds to whole weeks.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      parameters:
        - $ref: "#/components/parameters/searchDays"
        - $ref: "#/components/parameters/searchLimit"
        - name: non_brand
          in: query
          description: Only non-brand queries.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The numbers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchQueries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/goals:
    get:
      tags: [search]
      operationId: listGoals
      summary: Every search engine's goals by due date, each with its progress over its trailing window.
      description: None exist until someone adds one. Progress counts the window ending on the goal's provider's latest final day, a whole number of its step_days, so a 90-day Bing goal counts 91 days.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: Goals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [search]
      operationId: upsertGoal
      summary: Add a goal, or set the target of the goal with the same provider, metric, window and due date.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "200":
          description: The goal as saved, with its progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/goals/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    put:
      tags: [search]
      operationId: updateGoal
      summary: Replace a goal by id.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "200":
          description: The goal as saved, with its progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [search]
      operationId: deleteGoal
      summary: Delete a goal.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/settings/branded-terms:
    put:
      tags: [search]
      operationId: setBrandedTerms
      summary: Replace the branded search terms that decide brand against non-brand queries.
      description: Terms are lowercased. A query containing any of them, ignoring case, is brand. An empty list goes back to the default, your brand's name and aliases.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terms]
              additionalProperties: false
              properties:
                terms:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    minLength: 2
                    maxLength: 80
      responses:
        "200":
          description: The settings, with the branded terms in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/search/{provider}:
    parameters:
      - $ref: "#/components/parameters/searchProvider"
    delete:
      tags: [search]
      operationId: disconnectSearchProvider
      summary: Delete one provider's connection and its credential. The synced numbers stay.
      security:
        - session: [admin]
      responses:
        "204":
          description: Disconnected.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/search/{provider}/sites:
    parameters:
      - $ref: "#/components/parameters/searchProvider"
    get:
      tags: [search]
      operationId: listSearchSites
      summary: The sites the connected account can read, from Google's sites.list or Bing's GetUserSites.
      description: Bing lists verified sites only. The one matching your primary domain is marked suggested, preferring Google's domain property.
      security:
        - session: [admin]
      responses:
        "200":
          description: Sites.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchSite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/search/{provider}/site:
    parameters:
      - $ref: "#/components/parameters/searchProvider"
    put:
      tags: [search]
      operationId: setSearchSite
      summary: Pick the site to sync. The scheduler syncs it within a minute.
      description: The site must be one the connected account can read, named exactly as the provider lists it. backfill (default true) makes Google's first sync pull every day it keeps, about 16 months; without it the first sync pulls 28 days. Bing returns all it keeps on every sync, so backfill means nothing for it.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site]
              additionalProperties: false
              properties:
                site:
                  type: string
                  description: A url from GET /v1/search/{provider}/sites, such as sc-domain:example.com or https://www.example.com/.
                backfill:
                  type: boolean
                  default: true
      responses:
        "200":
          description: The provider's status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/search/{provider}/key:
    parameters:
      - $ref: "#/components/parameters/searchProvider"
    put:
      tags: [search]
      operationId: connectSearchKey
      summary: Connect a provider with a pasted key, stored sealed with ENCRYPTION_KEY.
      description: Needs a recent sign-in. For Google the key is a service account's JSON key file; add the service account's email as a user on the site in Search Console. For Bing it is the API key from Settings, API access in Bing Webmaster Tools. Byname checks that the provider accepts the key first, and keeps the site already picked. The response never carries the key.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              additionalProperties: false
              properties:
                key:
                  type: string
                  description: The JSON key file's contents for Google, or Bing's API key.
      responses:
        "200":
          description: The provider's status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Reauth"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/search/google/oauth/start:
    post:
      tags: [search]
      operationId: startGoogleOAuth
      summary: Start connecting Google Search Console with Google sign-in, read-only.
      description: Google only. Needs a recent sign-in and GSC_GOOGLE_CLIENT_ID. Open the returned URL in the browser; Google sends it back to /auth/gsc/callback, which stores the refresh token sealed and redirects to the page return_to names, Settings > Search engines by default.
      security:
        - session: [admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                return_to:
                  type: string
                  enum: [settings, onboarding]
                  default: settings
                  description: Where the browser goes after Google. One of these names, never a URL.
      responses:
        "200":
          description: Google's consent page.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Reauth"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/changes:
    get:
      tags: [changes]
      operationId: listChanges
      summary: Every site change, the latest merge first, with its first crawl, read days, before-period numbers and reads.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: Changes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Change"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [changes]
      operationId: logChange
      summary: Log a change made outside GitHub, so recrawl watch and verdicts follow it.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualChange"
      responses:
        "201":
          description: The change with its timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/changes/markers:
    get:
      tags: [changes]
      operationId: changeMarkers
      summary: One marker per merged pull request or logged change between the from and to dates, for a daily chart.
      description: Days are Search Console's Pacific Time days, at most 500 apart.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Markers, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChangeMarker"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/changes/settings:
    get:
      tags: [changes]
      operationId: getChangeSettings
      summary: When a change's interim and final reads fall, and the thresholds a move must pass against the control pages.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [changes]
      operationId: putChangeSettings
      summary: Replace the read days and thresholds. Changes already crawled keep their days.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeSettings"
      responses:
        "200":
          description: The settings as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/changes/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [changes]
      operationId: getChange
      summary: One change with its timeline and the URL inspections behind it.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: The change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [changes]
      operationId: deleteChange
      summary: Delete a change logged by hand.
      description: A change from GitHub follows the repo and its path rules, so deleting one is 409.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/control-pages:
    get:
      tags: [changes]
      operationId: listControlPages
      summary: The control pages verdicts compare against, by URL.
      description: A page past its hold date, in the instance's time zone, is inactive and drops out of the control set.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: Control pages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ControlPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [changes]
      operationId: upsertControlPage
      summary: Add a control page, or change the hold date and note of the one with the same URL.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, hold_until]
              additionalProperties: false
              properties:
                url:
                  type: string
                hold_until:
                  type: string
                  format: date
                note:
                  type: string
      responses:
        "200":
          description: The control page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/control-pages/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    delete:
      tags: [changes]
      operationId: deleteControlPage
      summary: Remove a control page.
      security:
        - apiKey: [config:write]
        - session: [config:write]
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/repo:
    get:
      tags: [changes]
      operationId: getRepo
      summary: The GitHub repo site changes come from, its token's expiry, the path rules and the last poll. Never the token.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      responses:
        "200":
          description: The repo connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [changes]
      operationId: connectRepo
      summary: Connect a GitHub repo with a fine-grained, read-only token, stored sealed with ENCRYPTION_KEY.
      description: Needs a recent sign-in. Byname checks that the token reads the repo first, and records the expiry GitHub reports. Reconnecting the same repo keeps its rules. The response never carries the token.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, token]
              additionalProperties: false
              properties:
                repo:
                  type: string
                  description: owner/name, such as northwind/site.
                token:
                  type: string
                  description: A fine-grained personal access token with read access to the repo's contents and pull requests.
      responses:
        "200":
          description: The repo connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Reauth"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
