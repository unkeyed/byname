        so https://www.northwind.example/blog/x/?ref=chatgpt links to
        northwind.example/blog/x. Answers to any question count, from any
        AI app, given at or after the mark. before and now say how the
        marked question's answers named you on the last check before the
        mark and on the latest check since, following the question through
        later question set versions.
