      operationId: markAlertsRead
      summary: Mark notifications read for the caller's person.
      description: Marking a notification read twice is fine. An API key marks them for the person who created it.
      security:
        - apiKey: [results:read]
        - session: [results:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
